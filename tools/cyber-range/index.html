<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CSO Cyber Range — Operator Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --abyss:#0A0E18;
  --console:#0F1524;
  --panel:#131B2E;
  --panel-2:#172033;
  --hairline:#21304D;
  --hairline-soft:#1A2540;
  --phosphor:#54E6C4;
  --phosphor-dim:#2F8E7D;
  --amber:#F2A33C;
  --amber-dim:#7A5827;
  --steel:#8294B6;
  --steel-dim:#566182;
  --ink-text:#DCE5F5;
  --alert:#FF5F73;
  --alert-dim:#7a3340;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(84,230,196,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(242,163,60,.05), transparent 55%),
    var(--abyss);
  color:var(--ink-text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.5;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--phosphor);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}

/* ---------- Classification top strip ---------- */
.classbar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:7px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  background:linear-gradient(90deg,#11324a,#0c2236);
  border-bottom:1px solid var(--hairline);
  text-transform:uppercase;color:#9fd9c9;
}
.classbar .dot{width:7px;height:7px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 10px var(--phosphor);display:inline-block;margin-right:7px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.classbar .right{display:flex;gap:18px;align-items:center;color:var(--steel)}

/* ---------- App layout ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 32px)}
.rail{
  border-right:1px solid var(--hairline);
  background:linear-gradient(180deg,var(--console),#0b1120);
  padding:22px 16px;position:sticky;top:32px;height:calc(100vh - 32px);overflow:auto;
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px;padding:0 4px}
.brand .mark{width:38px;height:38px;flex:0 0 38px;position:relative}
.brand .name{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .sub{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.18em;color:var(--steel);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--steel);
  padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.15s;
}
.nav button:hover{color:var(--ink-text);background:var(--panel)}
.nav button.active{color:var(--abyss);background:var(--phosphor);font-weight:600}
.nav button.active svg{stroke:var(--abyss)}
.nav button svg{width:17px;height:17px;stroke:currentColor;flex:0 0 17px}
.nav .seg{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--steel-dim);text-transform:uppercase;margin:18px 6px 7px}
.rail .operator{margin-top:22px;padding:13px;border:1px solid var(--hairline);border-radius:10px;background:var(--panel)}
.rail .operator .nm{font-weight:600;font-size:13.5px}
.rail .operator .rl{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--phosphor);letter-spacing:.08em;margin-top:2px}
.rail .operator button{margin-top:11px;width:100%;background:transparent;border:1px solid var(--hairline);color:var(--steel);border-radius:7px;padding:7px;font-size:12px}
.rail .operator button:hover{border-color:var(--alert);color:var(--alert)}

.main{padding:30px 38px 70px;max-width:1180px}
.page-head{margin-bottom:26px}
.page-head h1{font-size:30px;font-weight:700;margin-top:6px}
.page-head p{color:var(--steel);max-width:680px;margin:8px 0 0}

/* ---------- Panels / cards ---------- */
.panel{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}

.stat{position:relative;overflow:hidden}
.stat .k{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.stat .v{font-family:'Space Grotesk';font-weight:700;font-size:34px;margin-top:8px;line-height:1}
.stat .v small{font-size:16px;color:var(--steel);font-weight:500}
.stat .corner{position:absolute;top:0;right:0;width:42px;height:42px;border-top:1px solid var(--phosphor-dim);border-right:1px solid var(--phosphor-dim);opacity:.4;border-top-right-radius:10px}

.ring{--p:0;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--phosphor) calc(var(--p)*1%), var(--hairline-soft) 0);}
.ring .inner{width:64px;height:64px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:18px}

/* ---------- Tier badges ---------- */
.tier-pill{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid;display:inline-block}
.t-beginner{color:var(--phosphor);border-color:var(--phosphor-dim);background:rgba(84,230,196,.06)}
.t-intermediate{color:var(--amber);border-color:var(--amber-dim);background:rgba(242,163,60,.06)}
.t-advanced{color:var(--alert);border-color:var(--alert-dim);background:rgba(255,95,115,.06)}

/* ---------- Course cards ---------- */
.course-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.16s;position:relative}
.course-card:hover{border-color:var(--phosphor-dim);transform:translateY(-2px)}
.course-card .cid{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;color:var(--steel)}
.course-card h3{font-size:16px;font-weight:600}
.course-card .blurb{font-size:13px;color:var(--steel);flex:1}
.course-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.bar{height:5px;background:var(--hairline-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--phosphor-dim),var(--phosphor));border-radius:99px;transition:width .5s}
.status-tag{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.st-done{color:var(--phosphor);background:rgba(84,230,196,.1)}
.st-prog{color:var(--amber);background:rgba(242,163,60,.1)}
.st-new{color:var(--steel);background:var(--panel-2)}
.st-locked{color:var(--alert);background:rgba(255,95,115,.08)}

.check{color:var(--phosphor)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13.5px;transition:.15s}
.btn-primary{background:var(--phosphor);color:#06231d}
.btn-primary:hover{box-shadow:0 0 0 3px rgba(84,230,196,.2)}
.btn-amber{background:var(--amber);color:#2a1b06}
.btn-amber:hover{box-shadow:0 0 0 3px rgba(242,163,60,.2)}
.btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--ink-text)}
.btn-ghost:hover{border-color:var(--phosphor-dim);color:var(--phosphor)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Module checklist ---------- */
.module{display:flex;gap:14px;padding:15px;border:1px solid var(--hairline);border-radius:9px;background:var(--panel-2);margin-bottom:11px;align-items:flex-start}
.module .box{width:22px;height:22px;flex:0 0 22px;border:1.5px solid var(--steel-dim);border-radius:6px;display:grid;place-items:center;cursor:pointer;margin-top:2px;transition:.15s}
.module .box.done{background:var(--phosphor);border-color:var(--phosphor)}
.module .box.done svg{stroke:#06231d}
.module .box svg{width:13px;height:13px;stroke:transparent}
.module .mt{font-weight:600;font-size:14.5px;font-family:'Space Grotesk'}
.module .md{font-size:13px;color:var(--steel);margin-top:3px}

/* ---------- Lessons & study guide ---------- */
.lesson{border:1px solid var(--hairline);border-radius:10px;background:var(--panel-2);margin-bottom:13px;overflow:hidden}
.lesson .lhd{display:flex;gap:13px;align-items:flex-start;padding:15px 16px;cursor:pointer;user-select:none}
.lesson .num{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;background:rgba(84,230,196,.08);color:var(--phosphor);border:1px solid var(--phosphor-dim)}
.lesson.studied .num{background:var(--phosphor);color:#06231d;border-color:var(--phosphor)}
.lesson .lhd .mt{font-weight:600;font-size:15px;font-family:'Space Grotesk'}
.lesson .lhd .md{font-size:12.5px;color:var(--steel);margin-top:3px}
.lesson .chev{margin-left:auto;color:var(--steel);transition:transform .2s;flex:0 0 auto}
.lesson.open .chev{transform:rotate(90deg)}
.lesson .body{display:none;padding:0 16px 16px 55px}
.lesson.open .body{display:block}
.lesson .body p{font-size:14px;line-height:1.7;color:var(--ink-2)}
.lesson .mark{margin-top:14px}
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--hairline)}
.tab{padding:9px 16px;cursor:pointer;font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--phosphor);border-bottom-color:var(--phosphor)}
.flash{border:1px solid var(--hairline);border-left:3px solid var(--phosphor-dim);border-radius:0 8px 8px 0;background:var(--panel-2);padding:13px 15px;margin-bottom:10px}
.flash .fq{font-size:13.5px;font-weight:600;font-family:'Space Grotesk'}
.flash .fa{font-size:13px;color:var(--phosphor);margin-top:6px;display:none}
.flash .fa .lab{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.12em;color:var(--steel);text-transform:uppercase;margin-right:7px}
.flash.show .fa{display:block}
.flash .rev{font-family:'IBM Plex Mono';font-size:11px;color:var(--steel);cursor:pointer;margin-top:8px;display:inline-block}
.readychk{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);padding:7px 0}
.readychk .dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:grid;place-items:center;border:1.5px solid var(--steel-dim)}
.readychk.ok .dot{background:var(--phosphor);border-color:var(--phosphor)}
.readychk.ok .dot svg{width:9px;height:9px;stroke:#06231d}
.readychk .dot svg{width:9px;height:9px;stroke:transparent}
.locknote{display:flex;gap:10px;align-items:flex-start;background:rgba(242,163,60,.06);border:1px solid rgba(242,163,60,.25);border-radius:9px;padding:12px 14px;margin-top:12px;font-size:12.5px;color:var(--ink-2);text-align:left}
.locknote svg{width:16px;height:16px;stroke:var(--amber);flex:0 0 16px;margin-top:1px}
.preq{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.preq .chip{font-family:'IBM Plex Mono';font-size:11px;padding:4px 9px;border-radius:5px;border:1px solid var(--hairline);background:var(--panel-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.preq .chip.done{color:var(--phosphor);border-color:var(--phosphor-dim)}
.preq .chip.todo{color:var(--amber);border-color:rgba(242,163,60,.3)}

.deliverable{border-left:3px solid var(--amber);background:rgba(242,163,60,.05);padding:14px 16px;border-radius:0 8px 8px 0;margin-top:6px}
.deliverable .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}

/* ---------- Exam ---------- */
.q{border:1px solid var(--hairline);border-radius:10px;padding:18px 20px;margin-bottom:14px;background:var(--panel)}
.q .qn{font-family:'IBM Plex Mono';font-size:11px;color:var(--phosphor);letter-spacing:.08em}
.q .qt{font-weight:600;font-size:15px;margin:8px 0 14px;font-family:'Space Grotesk'}
.opt{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--hairline);border-radius:8px;margin-bottom:9px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--steel)}
.opt.sel{border-color:var(--phosphor);background:rgba(84,230,196,.07)}
.opt .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--steel-dim);flex:0 0 16px}
.opt.sel .rad{border-color:var(--phosphor);background:var(--phosphor);box-shadow:inset 0 0 0 3px var(--panel)}
.opt.correct{border-color:var(--phosphor);background:rgba(84,230,196,.12)}
.opt.wrong{border-color:var(--alert);background:rgba(255,95,115,.1)}

/* ---------- Auth ---------- */
.auth-wrap{display:grid;grid-template-columns:1.05fr .95fr;min-height:calc(100vh - 32px)}
.auth-art{position:relative;overflow:hidden;border-right:1px solid var(--hairline);
  background:linear-gradient(160deg,#0b1322,#0a0e18 60%);padding:54px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art .grid-bg{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--hairline-soft) 1px,transparent 1px),linear-gradient(90deg,var(--hairline-soft) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.auth-art .big{font-family:'Space Grotesk';font-weight:700;font-size:42px;line-height:1.05;position:relative;letter-spacing:-.02em}
.auth-art .big em{font-style:normal;color:var(--phosphor)}
.auth-form{padding:54px 56px;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.field{margin-bottom:15px}
.field label{display:block;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--console);border:1px solid var(--hairline);color:var(--ink-text);border-radius:8px;padding:11px 13px;font-family:inherit;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--phosphor);box-shadow:0 0 0 3px rgba(84,230,196,.12)}
.toggle-link{color:var(--phosphor);cursor:pointer;font-weight:600}
.err{color:var(--alert);font-size:13px;margin-top:4px;font-family:'IBM Plex Mono'}

/* ---------- Certificate ---------- */
.cert-tile{border:1px solid var(--hairline);border-radius:10px;overflow:hidden;background:var(--panel)}
.cert-tile .top{padding:16px 18px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cert-tile .bot{padding:13px 18px;display:flex;gap:9px}
.modal{position:fixed;inset:0;z-index:500;background:rgba(5,8,15,.86);display:grid;place-items:center;padding:24px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:22px;max-width:920px;width:100%}
canvas.cert{width:100%;height:auto;border:1px solid var(--hairline);border-radius:8px;background:#0a0e18}

.empty{text-align:center;padding:48px 20px;color:var(--steel)}
.empty svg{width:42px;height:42px;stroke:var(--steel-dim);margin-bottom:12px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--phosphor-dim);color:var(--phosphor);padding:12px 20px;border-radius:9px;font-family:'IBM Plex Mono';font-size:13px;z-index:800;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

.divider{height:1px;background:var(--hairline);margin:24px 0}
.muted{color:var(--steel)}
.tag-row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:none}
  .rail.open{display:block}
  .main{padding:22px 18px 60px}
  .cols-3,.cols-2,.cols-4{grid-template-columns:1fr}
  .auth-wrap{grid-template-columns:1fr}
  .auth-art{display:none}
  .auth-form{padding:34px 22px}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--hairline);color:var(--ink-text);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
@media print{body::before{display:none}}
</style>
</head>

<div id="root"></div>
<script>
/* ============================================================
   CSO Cyber Range — Operator Console
   CPE ST3 Cybersecurity Office (CSO)
   Self-contained LMS. Persistence via window.storage with
   in-memory fallback. (Demo auth — not production security.)
   ============================================================ */

/* ---------------- Storage layer ---------------- */
const Store = {
  mem:{},
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k,false); return r?r.value:null; } }
    catch(e){ /* missing key throws */ if(k in this.mem) return this.mem[k]; return null; }
    return (k in this.mem)?this.mem[k]:null;
  },
  async set(k,v){
    this.mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v,false); } }catch(e){}
  }
};
const uKey = u => 'lms_user_'+u.toLowerCase().replace(/[^a-z0-9_]/g,'_');
async function loadUser(u){ const r=await Store.get(uKey(u)); return r?JSON.parse(r):null; }
async function saveUser(rec){ await Store.set(uKey(rec.username), JSON.stringify(rec)); }
function hashPw(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return ('0000000'+(h>>>0).toString(16)).slice(-8); }
function shortHash(s){ let h=5381; for(let i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);} return ('00000000'+(h>>>0).toString(16).toUpperCase()).slice(-8); }

/* ---------------- App state ---------------- */
const App = { user:null, view:'dashboard', sel:null, exam:null, courseTab:'learn' };
const TIERS = {
  beginner:    {key:'beginner',     label:'Tier I — Foundational',  pre:'BC', roman:'I',   cls:'t-beginner'},
  intermediate:{key:'intermediate', label:'Tier II — Operational',  pre:'IC', roman:'II',  cls:'t-intermediate'},
  advanced:    {key:'advanced',     label:'Tier III — Strategic',   pre:'AC', roman:'III', cls:'t-advanced'}
};

/* ---------------- Course catalog (30 courses) ---------------- */
const COURSES = [
/* ===== TIER I — BEGINNER ===== */
{id:"BC-101",tier:"beginner",title:"Intro to Cybersecurity & Resilience Frameworks",blurb:"Foundational security principles and the shift from protection to engineered resilience.",
 modules:[
  {t:"The Foundations of Security",d:"CIA Triad vs. the Parkerian Hexad; defense-in-depth principles."},
  {t:"Shift to Cyber Resilience",d:"Engineering systems to absorb, adapt, withstand, and rapidly recover from adverse events."},
  {t:"Security Controls & Architecture Baselines",d:"Protective, detective, corrective, and deterrent controls."},
  {t:"Industry Framework Overview",d:"High-level orientation to NIST CSF, ISO 27001, and the DoD RMF."}],
 deliverable:"Build an initial defense-in-depth layout for a hypothetical mid-sized corporate network.",
 q:[
  {q:"Which three properties make up the classic CIA Triad?",o:["Confidentiality, Integrity, Availability","Control, Identity, Authorization","Compliance, Isolation, Auditing","Cryptography, Inspection, Alerting"],a:0},
  {q:"The Parkerian Hexad extends the CIA Triad by adding which additional attributes?",o:["Speed, scale, and cost","Possession/control, authenticity, and utility","Latency, jitter, and uptime","Patching, scanning, and logging"],a:1},
  {q:"A control whose primary purpose is to identify that an incident is occurring is best classified as:",o:["Preventive","Deterrent","Detective","Corrective"],a:2},

/* ---------------- Learning content (lessons + study guide overviews) ---------------- */
const CONTENT = {"BC-101": {"ov": "This course sets the vocabulary for everything that follows. Focus on the difference between the three security properties, the controls that protect them, and why modern programs measure resilience (recovering well) rather than only prevention (never being hit).", "ls": ["Security rests on three properties: Confidentiality (only authorized parties can read data), Integrity (data is accurate and unaltered), and Availability (systems are usable when needed) \u2014 together the CIA Triad. The Parkerian Hexad extends this with possession/control, authenticity, and utility to capture cases the triad misses, such as a stolen-but-still-encrypted laptop. Every control you ever deploy exists to defend one or more of these properties.", "Resilience accepts that breaches are inevitable and asks a harder question: when something fails, how quickly and gracefully does the organization absorb, adapt, withstand, and recover? A resilient system degrades safely instead of collapsing, preserves critical functions under stress, and restores full service fast. This mindset shifts investment from purely blocking attacks toward detection, response, and recovery capability.", "Controls are grouped by what they do in time relative to an incident. Preventive controls stop it (firewalls, access rules); detective controls reveal it is happening (logging, IDS); corrective controls fix the damage (backups, patching); deterrent controls discourage the attempt (warning banners, visible monitoring). A defense-in-depth architecture layers several control types so no single failure exposes the asset.", "Frameworks give programs a common structure. The NIST Cybersecurity Framework organizes work into Identify, Protect, Detect, Respond, and Recover. ISO 27001 certifies a formal information security management system. The DoD Risk Management Framework (RMF) is the U.S. government's structured process for authorizing a system to operate. You do not need every detail yet \u2014 just recognize what each is for."]}, "BC-102": {"ov": "Network analysis starts with knowing where each protocol lives and what 'normal' looks like. Anchor the OSI layers, the job of DNS/ARP/HTTP, default ports, and the idea that anomaly detection always begins from a baseline.", "ls": ["The OSI model breaks communication into seven layers; the TCP/IP model collapses them into four. The layers you will reference most are Layer 2 (Data Link, MAC addressing), Layer 3 (Network, IP addressing and routing), Layer 4 (Transport, TCP/UDP and ports), and Layer 7 (Application). Encapsulation means each layer wraps the layer above it with its own header \u2014 a packet is a set of nested envelopes.", "A handful of protocols carry most traffic. DNS resolves names to IP addresses; HTTP/S moves web content; DHCP hands out IP leases; ARP maps an IP address to a MAC address on the local segment; ICMP carries control and error messages (ping). Recognizing each protocol's normal request/response pattern lets you spot the abnormal one immediately.", "Ports identify which application a packet is destined for. Well-known defaults include 80 (HTTP), 443 (HTTPS/TLS), 22 (SSH), 53 (DNS), and 25 (SMTP). The combination of an IP address and a port is a socket. Traffic on non-standard ports, or a service answering on a port it should not, is a classic early indicator of compromise or misconfiguration.", "Wireshark captures traffic off the wire and lets you slice it with display filters (for example, dns or ip.addr == x). The single most important analytical habit is establishing a baseline of normal behavior first, so deviations stand out. Capturing everything blindly produces noise; comparing against a known-good baseline produces findings."]}, "BC-103": {"ov": "Hardening is about reducing what an attacker can touch on a host. Learn the Windows and Linux security primitives, why the kernel/user-space boundary matters, and how benchmarks turn hardening into a repeatable, auditable checklist.", "ls": ["Windows security centers on the registry, local and group policy, the event log subsystem, and built-in protections like Microsoft Defender. Hardening means disabling unused services, enforcing policy baselines, tightening account and audit settings, and ensuring security-relevant events are actually logged. The goal is to shrink the attack surface to only what the host genuinely needs.", "Linux hardening revolves around file permissions and ownership, restricting SSH (key-based auth, no root login), forwarding logs via syslog/journald, and running only the systemd services required. The principle is identical to Windows: every enabled service, open port, and over-permissive file is attack surface you must justify or remove.", "Code runs in one of two privilege domains. Kernel space has unrestricted access to hardware and memory; user space is sandboxed and must request privileged operations through system calls. This boundary is the operating system's core security guarantee \u2014 a kernel-level compromise is total, which is why drivers and kernel modules deserve special scrutiny.", "Configuration auditing turns hardening from opinion into evidence. Benchmarks such as the CIS Benchmarks and DISA STIGs define concrete, testable settings, and tooling can scan a host against them to produce a pass/fail report. This makes hardening repeatable across fleets and provides the documentation auditors and authorizing officials require."]}, "BC-104": {"ov": "Identity is the new perimeter. Keep the three IAA steps distinct, know the major access-control models and when each fits, and understand why least privilege and MFA are the highest-leverage controls you can apply.", "ls": ["Three distinct steps are often confused. Identification is claiming who you are (a username); Authentication is proving it (a password, token, or biometric); Authorization is what you are then allowed to do. Strong systems separate these cleanly \u2014 a verified identity still gets only the access its role grants, and nothing more.", "Access-control models define how permissions are decided. Discretionary (DAC) lets resource owners grant access; Mandatory (MAC) enforces system-wide labels the user cannot override; Role-Based (RBAC) assigns permissions to roles and users to roles; Attribute-Based (ABAC) evaluates policies against attributes like department, device, or time. RBAC is the workhorse of most enterprises.", "Modern authentication moves beyond passwords. Multi-factor authentication combines something you know, have, and are. Single sign-on (SSO) centralizes login through an identity provider using standards like SAML and OAuth/OIDC, while tokens carry signed claims about the authenticated user. MFA remains one of the single most effective controls against account takeover.", "Least privilege means every user, service, and process gets the minimum access required to do its job \u2014 no standing administrative rights, no broad shared accounts. Pair it with separation of duties so no one person can complete a sensitive action alone. Properly scoped RBAC plus least privilege dramatically limits the blast radius of any single compromised credential."]}, "BC-105": {"ov": "This is the front half of the Risk Management Framework. Learn the seven steps in order and go deep on Prepare, Categorize (using FIPS 199 impact levels), and Select (tailoring a control baseline).", "ls": ["The RMF is NIST's seven-step lifecycle for managing system risk: Prepare, Categorize, Select, Implement, Assess, Authorize, and Monitor. It is iterative, not one-and-done \u2014 Monitor feeds back into the earlier steps continuously. Memorize the order; nearly every government cybersecurity role references these steps by name.", "Prepare establishes the context before any control work begins: defining roles, risk tolerance, the organizational risk strategy, and a common control baseline that systems can inherit. Good preparation prevents wasted effort later by ensuring everyone agrees on scope, responsibilities, and how much risk the organization is willing to accept.", "Categorize sets the system's security impact level using FIPS 199, rating the potential impact of a loss of confidentiality, integrity, and availability as Low, Moderate, or High. The system's overall categorization typically takes the high-water mark across the three. This rating drives how strong the eventual control set must be.", "Select chooses a control baseline (from NIST SP 800-53) matched to the categorization, then tailors it \u2014 adding, removing, or adjusting controls to fit the system's real risk and environment. The output is a defensible, documented set of controls the system commits to implementing. Tailoring is where engineering judgment meets the catalog."]}, "BC-106": {"ov": "SP 800-53 is the control catalog the whole RMF leans on. Learn how it is organized into families, the difference between technical and non-technical controls, and how to write an implementation statement that will survive assessment.", "ls": ["NIST SP 800-53 is a catalog of security and privacy controls organized into roughly twenty families, each identified by a two-letter prefix \u2014 AC (Access Control), AU (Audit and Accountability), IA (Identification and Authentication), SC (System and Communications Protection), and so on. Navigating it means knowing which family a requirement lives in so you can find and cite the exact control.", "Controls split by how they are realized. Technical controls are enforced by the system itself (encryption, access enforcement, logging). Administrative (management/operational) controls are policies, procedures, and training enacted by people. A complete program needs both \u2014 a strong technical control fails if no procedure governs its use.", "Operational families cover day-to-day execution \u2014 incident response (IR), contingency planning (CP), configuration management (CM) \u2014 while physical and environmental controls (PE) protect the facility itself: locks, surveillance, power, and climate. Recognizing which family owns a requirement keeps your documentation organized and your assessor oriented.", "An implementation statement explains, for a specific control, exactly how this system satisfies it \u2014 concrete, verifiable, and tied to evidence. Vague language ('we follow best practices') fails assessment; assessable language ('all admin access requires MFA enforced by Entra ID Conditional Access policy X') passes. Write for someone who will independently test the claim."]}, "BC-107": {"ov": "This course is the assessor's perspective on RMF Step 5. Understand the assessor's independence, the three assessment methods, and the two key artifacts: the Security Assessment Plan and the Security Assessment Report.", "ls": ["The control assessor independently evaluates whether implemented controls are in place and operating as intended. Independence matters: the assessor should not be the same person who implemented the controls, so the evaluation is objective. Their findings feed the authorizing official's accept-the-risk decision.", "Assessors use three methods, often in combination. Examine reviews documents, configurations, and records. Interview questions the people who operate the control. Test exercises the control directly to observe actual behavior. Testing carries the most weight because it shows what the system really does, not just what the paperwork claims.", "The Security Assessment Plan (SAP) defines the scope, the controls to be assessed, the methods and depth, and the schedule \u2014 agreed before assessment begins. A clear SAP prevents disputes later about what was and was not evaluated, and ensures the assessment is repeatable and properly resourced.", "The Security Assessment Report (SAR) records what was found: each control's status, the evidence, and any deficiencies with their severity. The SAR is the primary input to the authorization decision and seeds the Plan of Action and Milestones (POA&M) for remediating gaps. Findings must be specific, evidenced, and risk-rated."]}, "BC-108": {"ov": "Threat intelligence turns raw data into decisions. Learn the intelligence lifecycle, the strategic/operational/tactical tiers, the standards that make intel shareable, and the basics of responsible OSINT collection.", "ls": ["Intelligence is produced through a repeating lifecycle: Planning and Direction, Collection, Processing, Analysis and Production, and Dissemination, followed by feedback. The discipline is what separates intelligence from a pile of alerts \u2014 each stage refines raw data toward a decision a stakeholder can act on.", "Intel serves three audiences. Strategic intelligence informs executives about long-term risk and adversary motivation. Operational intelligence guides defenders on specific campaigns and threat actors. Tactical intelligence delivers the concrete indicators (hashes, IPs, domains) that tools consume in near real time. Matching the product to the audience is the analyst's core skill.", "Sharing requires common formats. STIX structures threat information so machines and analysts read it the same way; TAXII transports it between organizations. Frameworks like MITRE ATT&CK provide a shared vocabulary of adversary tactics and techniques. Standards turn isolated observations into collective defense.", "Open-source intelligence (OSINT) gathers information from publicly available sources \u2014 DNS records, certificate transparency logs, social media, public registries. It is powerful and legal but demands discipline: verify across sources, respect scope and legal boundaries, and avoid tipping off the target. Corroboration is what makes OSINT trustworthy."]}, "BC-109": {"ov": "Most breaches start with a human, not an exploit. Learn the psychological levers attackers pull, how to dissect a phishing vector, the email authentication signals (SPF/DKIM/DMARC), and why fast, blame-free reporting matters most.", "ls": ["Social engineering exploits predictable psychology: authority (a message that appears to come from a boss), urgency (act now or lose access), scarcity, reciprocity, and trust. Recognizing the emotional pressure a message creates is the first defense \u2014 legitimate requests rarely demand that you bypass normal process immediately.", "Vector analysis dissects how an attack arrives and what it wants. Examine the sender, the displayed versus actual links, attachments, and the call to action. Phishing seeks credentials or a click; spear phishing is tailored to a specific target; business email compromise impersonates an executive to redirect money. Map the vector before reacting.", "Email authentication exposes spoofing. SPF lists which servers may send for a domain; DKIM cryptographically signs messages; DMARC ties them together and tells receivers what to do on failure. A failed alignment is a strong forgery signal \u2014 but a passing check does not guarantee safety, since attackers can pass authentication from look-alike domains.", "The single most valuable behavior is fast reporting. A user who reports a suspicious email in minutes lets the team pull it from other inboxes before more people click. This requires a blameless culture and a one-click report path; punishing victims simply drives incidents underground and lengthens dwell time."]}, "BC-110": {"ov": "Incident response is a disciplined process, not improvisation. Learn the IR lifecycle phases, how to triage and prioritize, the difference between containment and escalation, and why contemporaneous documentation is non-negotiable.", "ls": ["The incident response lifecycle (NIST SP 800-61) runs Preparation, Detection and Analysis, Containment/Eradication/Recovery, and Post-Incident Activity. Preparation done in advance \u2014 tooling, runbooks, contacts, and authority \u2014 determines how well the rest goes. Response quality is decided long before the incident occurs.", "Triage answers two questions fast: is this a real incident, and how bad is it? Analysts validate the alert, scope the affected systems, and assign severity based on impact and urgency. Good triage prevents both panic over false positives and dangerous under-reaction to a genuine breach.", "Containment limits spread \u2014 isolating a host, disabling an account, blocking a domain \u2014 and may be short-term (stop the bleeding) or long-term (a sustained fix). Escalation routes the incident to the right authority and skill level when severity, scope, or decision rights exceed the responder's mandate. Knowing when to escalate is as important as knowing how to contain.", "Document everything as it happens: what was observed, what action was taken, when, and by whom. Contemporaneous notes support the post-incident review, legal and regulatory needs, and any future prosecution. Memory is unreliable under stress; a clear timeline is the most defensible artifact an incident produces."]}, "IC-201": {"ov": "Cloud security reassigns responsibility rather than removing it. Master the shared responsibility model, cloud IAM and resource policies, how hybrid connectivity is secured, and why continuous logging is the backbone of cloud assurance.", "ls": ["The shared responsibility model divides security between provider and customer. The provider secures the cloud itself (physical, hypervisor, managed-service internals); the customer secures what they put in the cloud \u2014 data, identities, configuration, and access. Most cloud breaches stem from the customer side, especially misconfiguration, not provider failure.", "Cloud IAM controls who and what can act on resources. Identities (users, groups, roles, service accounts) are granted permissions through policies attached to identities or directly to resources. The recurring failure mode is over-permissioning; scope policies tightly, prefer roles over long-lived keys, and audit for wildcard or admin grants.", "Hybrid architectures connect on-prem networks to the cloud via VPNs or dedicated private links, extending identity and segmentation across both. The design challenge is maintaining consistent policy and visibility across environments so the connection does not become an unmonitored bridge an attacker can ride inward.", "Cloud platforms emit rich telemetry \u2014 control-plane logs (e.g., CloudTrail-style API audit logs), flow logs, and service logs. Centralizing and continuously analyzing these is how you detect misconfiguration and intrusion in an environment with no physical perimeter. In the cloud, logging is not optional instrumentation; it is the primary detective control."]}, "IC-202": {"ov": "Vulnerability management is a prioritization problem, not a scanning problem. Learn how scanning works at scale, how to rank findings by real risk, how patches move safely to production, and how to track remediation to closure.", "ls": ["Scanners identify known weaknesses by matching system attributes against vulnerability databases, either with credentials (authenticated, deeper) or without (unauthenticated, attacker's-eye view). At scale, scanning must be orchestrated \u2014 scheduled, scoped, and distributed \u2014 so coverage is complete without overwhelming the network or the team.", "Raw scan output always exceeds capacity to fix, so prioritization is everything. CVSS scores severity, but real risk-based prioritization layers on exploitability (is there a known exploit in the wild, e.g., CISA KEV), asset criticality, and exposure. A medium CVSS on an internet-facing crown-jewel may outrank a critical on an isolated test box.", "Patches must be tested before broad deployment to avoid breaking production. A staged lifecycle \u2014 test, pilot ring, then phased rollout \u2014 balances speed against stability, with a rollback plan ready. Emergency patches for actively exploited flaws compress this timeline but should never skip a basic sanity check.", "Tracking closes the loop: every finding has an owner, a due date tied to its risk, and a verified remediation (or a documented, risk-accepted exception). Metrics like mean-time-to-remediate and aging reports show whether the program is actually reducing risk or just generating reports. Unverified 'fixes' are how vulnerabilities quietly persist."]}, "IC-203": {"ov": "Application security works best when it moves left \u2014 earlier in development. Learn shift-left principles, the difference between SAST and DAST, how to harden containers and base images, and how to secure infrastructure as code.", "ls": ["Shift-left means embedding security into design and development rather than bolting it on before release. Finding a flaw in code review costs a fraction of finding it in production. Practically, this means security requirements, threat modeling, and automated checks integrated into the developer's normal workflow and CI pipeline.", "Two complementary testing approaches exist. Static Application Security Testing (SAST) analyzes source code without running it, catching insecure patterns early but with false positives. Dynamic Analysis (DAST) tests the running application from the outside, catching runtime and configuration issues SAST cannot see. Mature programs run both, plus dependency scanning.", "Containers shrink attack surface only if hardened. Start from minimal, trusted base images, pin versions, run as non-root, drop unneeded capabilities, and scan images for known vulnerabilities before they ship. A bloated or stale base image silently imports every vulnerability it contains into every workload built on it.", "Infrastructure as Code (IaC) defines environments in version-controlled templates (Terraform, CloudFormation). This makes security scannable and repeatable \u2014 policy-as-code can reject an insecure configuration before it is ever deployed. The risk is that a single bad template propagates a misconfiguration everywhere, so IaC must be reviewed and scanned like application code."]}, "IC-204": {"ov": "This course operationalizes the back half of RMF inside eMASS. Learn the eMASS interface's role, how Steps 4-6 execute there, how to build a defensible POA&M, and what continuous authorization (cATO) actually requires.", "ls": ["eMASS (Enterprise Mission Assurance Support Service) is the DoD's system of record for managing RMF packages. It tracks controls, assessment results, artifacts, and authorization status in one workflow. Knowing the interface \u2014 where control implementation, test results, and risk artifacts live \u2014 is a practical job skill for anyone working DoD authorizations.", "RMF Steps 4-6 (Implement, Assess, Authorize) are recorded and routed in eMASS. Implementation statements and evidence are entered, assessors record findings, and the package flows to the authorizing official for an authorization decision. eMASS turns the abstract RMF lifecycle into a concrete, auditable system workflow.", "A Plan of Action and Milestones (POA&M) documents each unresolved weakness: the deficiency, the planned remediation, resources, and a realistic completion milestone. A good POA&M is honest and dated; it lets the authorizing official accept residual risk knowingly and lets the team track remediation. A POA&M full of slipped dates signals a stalled program.", "Continuous authorization (cATO) replaces the periodic re-authorization scramble with ongoing monitoring, automated evidence, and a robust feedback loop, so authorization is maintained continuously rather than recertified every few years. It demands mature automation and real-time visibility \u2014 the payoff is faster, evidence-backed risk decisions."]}, "IC-205": {"ov": "Threat hunting is proactive, hypothesis-driven searching for adversaries that evaded detection. Learn the hunting mindset, the endpoint and network vectors to pursue, and how to build effective queries against SIEM data.", "ls": ["Hunting assumes a breach has already occurred and that automated alerts missed it. Rather than waiting for an alarm, the hunter forms a hypothesis \u2014 often grounded in MITRE ATT&CK techniques or fresh threat intel \u2014 and searches the data to prove or disprove it. The output is either a found intrusion or a new, durable detection.", "On endpoints, hunters look for the artifacts of attacker behavior: anomalous process trees (e.g., a document spawning a shell), suspicious persistence mechanisms, credential-access tooling, and living-off-the-land use of legitimate binaries. EDR telemetry is the primary data source, and knowing what normal process lineage looks like is essential.", "On the network, hunters pursue beaconing to command-and-control, unusual data egress volumes, DNS tunneling, and connections to newly registered or low-reputation domains. Network data catches what endpoint coverage misses, especially on unmanaged or IoT devices. Together endpoint and network vectors give cross-validating evidence.", "Effective hunting depends on precise queries against centralized data in a SIEM. Strong queries scope tightly, filter known-good to reduce noise, and pivot from one indicator to related activity. A confirmed hunt should always be converted into an automated detection so the same technique never has to be hunted manually again."]}, "IC-206": {"ov": "Cryptography protects data in transit and at rest. Learn the symmetric/asymmetric split and where each is used, how PKI establishes trust, how TLS combines them, and why key management is the part that usually fails.", "ls": ["Symmetric cryptography uses one shared key for both encryption and decryption (e.g., AES) \u2014 fast, ideal for bulk data, but the key must be shared securely. Asymmetric cryptography uses a public/private key pair (e.g., RSA, ECC) \u2014 slower, but solves key distribution and enables digital signatures. Real systems use each for what it does best.", "Public Key Infrastructure (PKI) binds a public key to a verified identity through certificates issued by a Certificate Authority. A chain of trust runs from a trusted root CA down to the end-entity certificate; clients trust the leaf because they trust the root. Revocation (CRL/OCSP) handles certificates that must be invalidated before expiry.", "TLS combines both worlds. The handshake uses asymmetric cryptography to authenticate the server and securely agree on a session key, then switches to fast symmetric encryption for the actual data. Understanding this hybrid flow explains why certificate validation, cipher selection, and forward secrecy all matter to a connection's safety.", "Keys have a lifecycle \u2014 generation, distribution, storage, rotation, and destruction \u2014 and most cryptographic failures are key-management failures, not algorithm failures. Keys belong in protected stores (HSMs or managed key vaults), must be rotated, and must never be hard-coded or committed to source. Strong crypto with weak key handling provides false confidence."]}, "IC-207": {"ov": "Penetration testing safely simulates an attacker to prove what is actually exploitable. Learn how scope and reconnaissance are set, how exploits are selected and verified, what post-exploitation reveals, and why the report is the real deliverable.", "ls": ["Every engagement begins with explicit scope and rules of engagement \u2014 what is in bounds, what is off limits, timing, and authorization in writing. Reconnaissance then maps the target's footprint (hosts, services, exposed information) using passive and active techniques. Acting outside agreed scope is both unprofessional and potentially illegal.", "Findings from recon drive exploit selection. The tester chooses techniques matched to the discovered services and verifies exploitability rather than assuming it \u2014 a scanner flag is a hypothesis, a successful (and safe) proof-of-concept is evidence. Verification distinguishes a real penetration test from an automated scan with a fancier report.", "Post-exploitation explores what an attacker could actually do after initial access: escalating privileges, moving laterally to other systems, and reaching the data or control that represents true business impact. This is where a single foothold is shown to threaten crown-jewel assets, demonstrating risk in terms leadership understands.", "The report is the product the client pays for. It translates technical findings into prioritized, actionable remediation, with clear evidence, business impact, and reproduction steps. A brilliant exploit chain delivers no value if the report cannot drive the fix. Write for both the engineer who patches and the executive who funds it."]}, "IC-208": {"ov": "Digital forensics recovers and preserves evidence of what happened. Learn forensic readiness and chain of custody, host acquisition of memory and disk, log correlation, and how a defensible timeline is assembled.", "ls": ["Forensic readiness means the environment is prepared to yield sound evidence before an incident occurs \u2014 adequate logging, retention, and acquisition capability. Chain of custody documents who handled each piece of evidence, when, and how, with integrity hashes proving it was not altered. Evidence that cannot prove its integrity is evidence that cannot be relied upon.", "Host forensics acquires both volatile and non-volatile data. Memory captures running processes, network connections, and unencrypted artifacts that vanish at shutdown, so it is collected first under the order of volatility. Disk imaging preserves a bit-for-bit copy for offline analysis. Always work from verified copies, never the original media.", "No single log tells the whole story. Correlating events across host, authentication, network, and application logs reconstructs an actor's path \u2014 a failed login here, a new process there, an outbound connection moments later. Synchronized, accurate timestamps are what make correlation trustworthy; clock skew quietly corrupts an investigation.", "Timeline analysis sequences correlated events into a coherent narrative of the incident: initial access, actions on objectives, and exit. A clear timeline answers the questions leadership, legal, and regulators actually ask \u2014 what happened, when, and what was affected \u2014 and it is the synthesis that turns scattered artifacts into conclusions."]}, "IC-209": {"ov": "SOAR scales a security team by automating repetitive response. Learn SOAR architecture, how playbooks encode decision logic, how automated enrichment speeds triage, and the guardrails automated containment requires.", "ls": ["Security Orchestration, Automation, and Response (SOAR) connects disparate tools and automates workflows that analysts would otherwise run by hand. Its value is leverage: it lets a small team respond consistently at machine speed, reduces alert fatigue, and frees analysts for the judgment-heavy work machines cannot do.", "A playbook is a codified workflow \u2014 a sequence of conditional steps that responds to a given alert type. Designing one means modeling the decision logic an experienced analyst follows: gather context, branch on findings, act, and document. Good playbooks are explicit about every branch, including when to hand off to a human.", "Automated enrichment gathers context the moment an alert fires \u2014 reputation lookups, asset and user details, related events \u2014 and attaches it to the case. By the time an analyst opens the ticket, the question 'is this real and how bad' is largely pre-answered, collapsing triage time from minutes to seconds.", "Automated containment (isolating a host, disabling an account) is powerful and dangerous; a flawed playbook can disrupt the business at scale. High-impact actions need guardrails: scoping, approval gates for irreversible steps, and a tested rollback. Automate aggressively for enrichment and low-risk actions, conservatively for actions that can cause outages."]}, "IC-210": {"ov": "Zero Trust replaces the trusted perimeter with continuous verification. Learn its core tenets, how microsegmentation limits lateral movement, the role of software-defined networking, and how secure enclaves protect the most sensitive assets.", "ls": ["Zero Trust's central principle is 'never trust, always verify' \u2014 no user, device, or network location is implicitly trusted, and every access request is authenticated, authorized, and evaluated against context (identity, device posture, behavior) before being granted, least-privilege, per session. The network's inside is no longer treated as safe.", "Microsegmentation divides the network into small, individually policed zones so a compromise in one cannot freely spread. Instead of a flat internal network where one foothold reaches everything, each workload's communication is explicitly permitted and everything else is denied. This is the primary control against lateral movement.", "Software-defined networking (SDN) and policy engines make microsegmentation practical by decoupling control from hardware, letting policy follow workloads dynamically. Identity- and attribute-aware policy can adjust access in real time as posture changes, which is what allows Zero Trust enforcement at the speed and scale modern environments demand.", "Secure enclaves give the highest-value assets extra isolation \u2014 tightly controlled segments, hardened access paths, and dedicated monitoring. Combined with Zero Trust verification and microsegmentation, enclaves ensure that even an attacker loose in the broader environment faces a fresh, stringent barrier at the crown jewels."]}, "AC-301": {"ov": "AI-native systems introduce new architecture and new attack surface. Learn the components of an AI-native design, how multi-agent systems coordinate, how to secure the AI infrastructure, and why evaluation and human oversight are core controls.", "ls": ["An AI-native architecture is built around models as first-class components \u2014 inference services, retrieval and vector stores, orchestration, and the data pipelines feeding them. Security has to consider classic concerns plus model-specific ones like prompt injection, data poisoning, and sensitive-data leakage through outputs. The model is both an asset and an attack surface.", "Multi-agent systems coordinate several specialized agents (and tools) to accomplish tasks one model could not handle alone. Coordination introduces trust and authority questions: which agent can invoke which tool, how instructions propagate, and how a compromised or manipulated agent is contained. Treat inter-agent messages as untrusted input.", "Securing AI infrastructure means protecting the model supply chain (provenance of weights and training data), the inference endpoints (authentication, rate limiting, isolation), and the data stores behind retrieval. Poisoned training data, tampered model artifacts, and over-trusted tool access are the failure modes that distinguish AI security from ordinary application security.", "Evaluation and human-in-the-loop guardrails are controls, not afterthoughts. Systematic evaluation catches harmful or wrong behavior before deployment and monitors for drift after; human review gates high-stakes or irreversible actions. The principle mirrors least privilege: the more autonomy and impact an agent has, the more rigorous its evaluation and oversight must be."]}, "AC-302": {"ov": "Modern security operations run on a data platform. Learn lakehouse design, high-velocity ingestion, why normalization to open standards matters, and how distributed query engines make petabyte-scale analytics possible.", "ls": ["A lakehouse combines a data lake's cheap, flexible storage with a warehouse's structure and query performance, giving security teams one platform for both raw and analytics-ready data. For security, it means retaining high-volume telemetry affordably while still supporting fast detection queries and long-horizon hunting over historical data.", "Security data arrives fast and continuously, so ingestion pipelines must handle high velocity and volume without dropping events. Streaming ingestion, buffering, and back-pressure handling keep pace with bursts, while schema-on-read flexibility accommodates the many log formats a security program collects from across the enterprise.", "Logs from hundreds of sources use incompatible formats, so normalization to a common schema (using open standards like OCSF) is what makes cross-source detection and correlation possible. Without it, every query must special-case each source; with it, one detection works across the whole estate. Open standards also prevent vendor lock-in.", "At petabyte scale, queries must be distributed across many nodes to return in useful time. Partitioning, columnar formats, and engines that push computation to the data enable interactive hunting over enormous datasets. Understanding how the query engine parallelizes work lets analysts write queries that finish in seconds rather than hours."]}, "AC-303": {"ov": "Red teaming tests defenses by emulating a real adversary end to end. Learn its foundations versus pen testing, how to design a threat-emulation plan, evasion and operational tradecraft, and why purple-team integration multiplies the value.", "ls": ["Red teaming goes beyond finding vulnerabilities; it emulates a specific adversary's full campaign against people, process, and technology to test whether the organization can detect and respond. Where a pen test asks 'can this be exploited,' a red team asks 'would we even notice, and could we stop it.' Objectives are mission-based, not vulnerability-based.", "A threat-emulation plan grounds the engagement in a real adversary's known behavior, mapping objectives to MITRE ATT&CK tactics and techniques. This makes the exercise realistic and measurable \u2014 the blue team's detection coverage can be assessed technique by technique. Rules of engagement and explicit authorization remain mandatory.", "Evasion and operational tradecraft keep the red team realistic: minimizing footprint, blending with normal activity, managing command-and-control discreetly, and adapting when detected. The goal is not to 'win' silently forever but to genuinely test detection \u2014 including operating loud enough, at times, to validate that defenders can catch the technique.", "The highest value comes from purple teaming \u2014 red and blue working together to turn each finding into improved detection and response. An undetected technique becomes a new detection rule; a slow response becomes a tuned playbook. A red-team report that does not measurably strengthen the blue team has under-delivered."]}, "AC-304": {"ov": "Supply chain attacks compromise you through your dependencies and vendors. Learn the categories of software supply chain risk, how to operationalize SBOMs, how to audit hardware and third parties, and why continuous component tracking is essential.", "ls": ["Software supply chain risk spans compromised dependencies, malicious packages, tampered build pipelines, and poisoned updates \u2014 the SolarWinds and dependency-confusion patterns. The attacker's leverage is reach: one compromised component propagates to everyone who trusts it. Defending requires verifying the provenance and integrity of everything you incorporate.", "A Software Bill of Materials (SBOM) is a complete inventory of the components in a piece of software. Operationalizing it means generating SBOMs automatically in the build, storing them, and querying them the moment a new vulnerability appears \u2014 turning 'are we affected by this CVE' from a week of investigation into a database lookup.", "Hardware and third-party vendors extend the attack surface beyond your code. Auditing means assessing vendor security practices, validating component authenticity to counter counterfeits and implants, and contractually requiring security commitments. A vendor with weak security effectively inherits access to your environment through the trust you extend them.", "Components change and new vulnerabilities surface constantly, so a point-in-time check is insufficient. Continuous tracking monitors your component inventory against vulnerability feeds and integrity signals in real time, alerting when a previously clean dependency becomes risky. Supply chain security is a standing process, not a release-time gate."]}, "AC-305": {"ov": "Major incidents are managed, not just responded to. Learn the crisis command framework, how to coordinate cross-functional teams under pressure, the regulatory disclosure landscape, and how business continuity restores operations.", "ls": ["A crisis command framework (often built on the Incident Command System) defines clear roles and authority during a major incident: who decides, who communicates, who executes. Establishing command structure before the crisis prevents the confusion and duplicated effort that turn a serious incident into a catastrophic one.", "Major incidents pull in legal, communications, executive leadership, HR, and technical teams who normally do not work in lockstep. Coordination means a single source of truth, disciplined communication cadence, and clear decision rights, so the organization speaks and acts coherently rather than as competing factions under stress.", "Disclosure is now a legal obligation with deadlines \u2014 regulations such as breach-notification laws, SEC materiality reporting, and sector rules dictate what must be reported, to whom, and how quickly. Legal counsel guides these decisions; getting disclosure wrong can compound a technical incident with regulatory and reputational damage.", "Business continuity and disaster recovery restore operations against defined objectives \u2014 the Recovery Time Objective (how fast) and Recovery Point Objective (how much data loss is tolerable). Post-crisis, the lessons-learned review feeds continuity plans back into preparation, closing the loop so the organization emerges more resilient."]}, "AC-306": {"ov": "Operational Technology security protects systems where safety and uptime outrank confidentiality. Learn how OT differs from IT, the industrial protocols involved, OT-specific defenses and segmentation, and how safety instrumented systems are protected.", "ls": ["OT (industrial control systems, SCADA, PLCs) runs physical processes, so its priorities invert IT's: availability and safety come first, confidentiality last, and devices may run for decades without patching. Treating OT like IT \u2014 pushing patches, scanning aggressively, rebooting at will \u2014 can halt production or endanger people. The mindset must adapt to the environment.", "OT speaks specialized protocols \u2014 Modbus, DNP3, and others \u2014 many designed before security was a concern, lacking authentication or encryption. Understanding these protocols and their weaknesses is essential, because the usual IT defenses do not map cleanly and naive interference can disrupt a live physical process.", "The Purdue model organizes OT into zones, and segmentation between IT and OT (with tightly controlled conduits and DMZs) is the foundational defense. Passive monitoring is preferred over active scanning to avoid disturbing fragile devices. The goal is to keep the corporate network's compromises from ever reaching the plant floor.", "Safety Instrumented Systems (SIS) are the last-resort controls that bring a process to a safe state \u2014 and they are sacrosanct. They must be isolated from general OT and IT networks so that no cyber event can disable the protection that prevents physical harm. Compromising an SIS is the difference between an outage and a disaster."]}, "AC-307": {"ov": "Malware analysis and reverse engineering reveal what malicious code does and who built it. Learn static disassembly, dynamic execution analysis, defeating anti-analysis tricks, and attributing nation-state capability.", "ls": ["Static analysis examines a sample without running it \u2014 disassembling and decompiling to inspect code structure, strings, imports, and logic. It is safe and thorough but slow against obfuscation. Reading disassembly to understand a function's behavior is the core reverse-engineering skill that no automated tool fully replaces.", "Dynamic analysis runs the sample in an isolated sandbox and observes behavior: files written, registry and process changes, and network callbacks. It quickly reveals what static analysis might miss behind packing, but sophisticated malware detects sandboxes, so analysts combine both approaches and validate findings against each other.", "Advanced malware fights back with anti-analysis defenses \u2014 packing, anti-debugging, sandbox detection, and self-modifying code. Defeating them means unpacking, patching out checks, and using stealthier instrumentation. Recognizing these techniques is itself an indicator of sophistication and intent, narrowing who likely built the sample.", "Nation-state capability shows in tradecraft: custom tooling, novel exploits, careful operational security, and code reuse that ties samples to known actors. Attribution is probabilistic and built from many weak signals \u2014 infrastructure, code lineage, timing, and targeting \u2014 never a single smoking gun. Analysts present confidence levels, not certainty."]}, "AC-308": {"ov": "Mission assurance moves security past compliance to guaranteed operational capability. Learn why checkbox compliance falls short, how to define operational capability, how to engineer resilient core infrastructure, and how to audit capability continuously.", "ls": ["Compliance proves you met a control list at a point in time; it does not prove the mission survives a real attack. Mission assurance asks the harder, outcome-based question: can the organization continue critical operations while under attack? A perfectly compliant system can still fail its mission, which is why compliance is a floor, not the goal.", "Defining operational capability means identifying the mission-essential functions and the systems, data, and dependencies they rely on, then specifying what 'still working' means under degraded conditions. This shifts the conversation from 'is control X implemented' to 'can function Y continue,' which is what leadership actually cares about.", "Resilient core infrastructure is engineered to degrade gracefully \u2014 redundancy, failover, isolation of critical functions, and the assumption that components will be compromised. The design target is to lose pieces without losing the mission, contain damage to its origin, and keep essential services available even mid-incident.", "Capability cannot be assumed; it must be tested continuously through exercises, fault injection, and assessment that prove mission functions actually survive realistic stress. Continuous auditing of capability \u2014 not just of control checkboxes \u2014 is what keeps assurance honest as systems, threats, and dependencies change over time."]}, "AC-309": {"ov": "Risk quantification turns cyber risk into financial terms leaders can act on. Learn the principles of quantification (and frameworks like FAIR), how to model probability from data, how to calculate loss impact, and how to justify security investment.", "ls": ["Quantitative risk analysis expresses risk in money and probability rather than red/yellow/green heat maps. Frameworks like FAIR decompose risk into loss event frequency and loss magnitude, producing a defensible range. This lets security compete for budget in the same language as the rest of the business, which qualitative ratings cannot.", "Probability modeling estimates how often a loss event will occur, drawing on incident history, threat intelligence, industry data, and calibrated expert estimates. Results are expressed as distributions and ranges, not false-precision single numbers, and Monte Carlo simulation propagates the uncertainty through the model rather than hiding it.", "Loss impact calculation tallies what an event actually costs: direct response and recovery, business interruption, legal and regulatory penalties, and reputational harm. Distinguishing primary loss (immediate) from secondary loss (downstream, like fines and lost customers) produces a credible total that survives scrutiny from finance.", "Cost-benefit analysis ranks investments by how much risk reduction each dollar buys. Comparing a control's annualized cost against the reduction in expected loss (and computing a return on security investment) turns 'we should spend more on security' into a prioritized, evidence-backed business case that executives can approve with confidence."]}, "AC-310": {"ov": "Strategic leadership aligns security with the business and communicates risk to those who govern it. Learn strategic alignment, enterprise policy architecture, managing complex support demands, and how to brief a board.", "ls": ["Strategic alignment ties the security program to business objectives and the organization's risk appetite, so security enables the mission rather than obstructing it. A strategy that ignores business goals gets ignored or routed around; one framed in terms of protecting revenue, trust, and continuity earns sustained executive support.", "Enterprise policy architecture is the hierarchy that governs behavior: policies set direction and intent, standards make them measurable, and procedures make them executable. A coherent structure \u2014 without gaps or contradictions \u2014 is what makes governance enforceable and auditable across a large, complex organization.", "As the CSO's remit grows, demands multiply across business units, regulators, and technical teams with competing priorities. Managing this means clear governance forums, prioritization tied to risk, and resource allocation that reflects strategy rather than whoever shouts loudest. Leadership here is as much about saying no well as saying yes.", "Boards govern risk but are not technical, so communication must translate cyber risk into business terms \u2014 financial exposure, strategic impact, and trend lines \u2014 with clear asks and decisions. Effective board reporting is concise, honest about residual risk, and oriented to governance decisions, not technical detail. The goal is informed oversight, not a tutorial."]}};

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const root = $('root');
const byTier = t => COURSES.filter(c=>c.tier===t);
const course = id => COURSES.find(c=>c.id===id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(d){return new Date(d).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});}

function ensureProgress(c){
  App.user.progress = App.user.progress||{};
  if(!App.user.progress[c]) App.user.progress[c]={modules:[false,false,false,false],examPassed:false,examScore:0,completedAt:null};
  return App.user.progress[c];
}
function allStudied(p){return p.modules.length===4 && p.modules.every(Boolean);}
function content(id){return CONTENT[id]||{ov:'',ls:['','','','']};}
function courseStatus(id){
  const p=App.user.progress&&App.user.progress[id];
  if(!p) return 'new';
  if(p.examPassed) return 'done';
  if(p.modules.some(Boolean)) return 'prog';
  return 'new';
}
function coursePct(id){
  const p=App.user.progress&&App.user.progress[id];
  if(!p) return 0;
  if(p.examPassed) return 100;
  return Math.round(p.modules.filter(Boolean).length/4*100);
}
function tierStats(t){
  const list=byTier(t); let done=0;
  list.forEach(c=>{if(App.user.progress&&App.user.progress[c.id]&&App.user.progress[c.id].examPassed)done++;});
  return {done,total:list.length,pct:Math.round(done/list.length*100)};
}
function tierComplete(t){const s=tierStats(t);return s.done===s.total;}
function capstoneState(t){App.user.capstones=App.user.capstones||{};return App.user.capstones[t]||null;}
function allCerts(){return App.user.certs||[];}
function pushRecent(id){
  App.user.recent=(App.user.recent||[]).filter(x=>x!==id);
  App.user.recent.unshift(id);

}

async function doRegister(){
  const u=$('r-user').value.trim(), n=$('r-name').value.trim(), e=$('r-email').value.trim(),
        rl=$('r-role').value, pw=$('r-pw').value, pw2=$('r-pw2').value;
  const err=$('auth-err');
  if(!u||!n||!pw){err.textContent='Operator ID, full name, and passphrase are required.';return;}
  if(pw.length<6){err.textContent='Passphrase must be at least 6 characters.';return;}
  if(pw!==pw2){err.textContent='Passphrases do not match.';return;}
  if(await loadUser(u)){err.textContent='That Operator ID is already registered. Try signing in.';return;}
  const rec={username:u,name:n,email:e,role:rl,pw:hashPw(pw),createdAt:Date.now(),progress:{},capstones:{},recent:[],certs:[]};
  await saveUser(rec);
  await Store.set('lms_session',u);
  App.user=rec; App.view='dashboard'; render();
  toast('Operator profile provisioned — welcome aboard.');
}
async function doLogin(){
  const u=$('l-user').value.trim(), pw=$('l-pw').value, err=$('auth-err');
  const rec=await loadUser(u);
  if(!rec||rec.pw!==hashPw(pw)){err.textContent='Invalid Operator ID or passphrase.';return;}
  await Store.set('lms_session',u);
  App.user=rec; App.view='dashboard'; render();
  toast('Authentication confirmed.');
}
