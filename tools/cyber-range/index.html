<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CSO Cyber Range — Training Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"></noscript>
<style>
:root{
  --abyss:#0A0E18;
  --console:#0F1524;
  --panel:#131B2E;
  --panel-2:#172033;
  --hairline:#21304D;
  --hairline-soft:#1A2540;
  --phosphor:#54E6C4;
  --phosphor-dim:#2F8E7D;
  --amber:#F2A33C;
  --amber-dim:#7A5827;
  --steel:#8294B6;
  --steel-dim:#566182;
  --ink-text:#DCE5F5;
  --alert:#FF5F73;
  --alert-dim:#7a3340;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(84,230,196,.06), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(242,163,60,.05), transparent 55%),
    var(--abyss);
  color:var(--ink-text);
  font-family:'Inter',system-ui,sans-serif;
  font-size:15px;
  line-height:1.5;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,.012) 0 1px, transparent 1px 3px);
  mix-blend-mode:overlay;opacity:.5;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.15;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',monospace}
a{color:var(--phosphor);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--steel)}

/* ---------- Classification top strip ---------- */
.classbar{
  position:sticky;top:0;z-index:200;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:7px 18px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.16em;
  background:linear-gradient(90deg,#11324a,#0c2236);
  border-bottom:1px solid var(--hairline);
  text-transform:uppercase;color:#9fd9c9;
}
.classbar .dot{width:7px;height:7px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 10px var(--phosphor);display:inline-block;margin-right:7px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.classbar .right{display:flex;gap:18px;align-items:center;color:var(--steel)}

/* ---------- App layout ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 32px)}
.rail{
  border-right:1px solid var(--hairline);
  background:linear-gradient(180deg,var(--console),#0b1120);
  padding:22px 16px;position:sticky;top:32px;height:calc(100vh - 32px);overflow:auto;
}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:26px;padding:0 4px}
.brand .mark{width:38px;height:38px;flex:0 0 38px;position:relative}
.brand .name{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em}
.brand .sub{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.18em;color:var(--steel);text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.nav button{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--steel);
  padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;transition:.15s;
}
.nav button:hover{color:var(--ink-text);background:var(--panel)}
.nav button.active{color:var(--abyss);background:var(--phosphor);font-weight:600}
.nav button.active svg{stroke:var(--abyss)}
.nav button svg{width:17px;height:17px;stroke:currentColor;flex:0 0 17px}
.nav .seg{font-family:'IBM Plex Mono';font-size:9.5px;letter-spacing:.2em;color:var(--steel-dim);text-transform:uppercase;margin:18px 6px 7px}
.rail .operator{margin-top:22px;padding:13px;border:1px solid var(--hairline);border-radius:10px;background:var(--panel)}
.rail .operator .nm{font-weight:600;font-size:13.5px}
.rail .operator .rl{font-family:'IBM Plex Mono';font-size:10.5px;color:var(--phosphor);letter-spacing:.08em;margin-top:2px}
.rail .operator button{margin-top:11px;width:100%;background:transparent;border:1px solid var(--hairline);color:var(--steel);border-radius:7px;padding:7px;font-size:12px}
.rail .operator button:hover{border-color:var(--alert);color:var(--alert)}

.main{padding:30px 38px 70px;max-width:1180px}
.page-head{margin-bottom:26px}
.page-head h1{font-size:30px;font-weight:700;margin-top:6px}
.page-head p{color:var(--steel);max-width:680px;margin:8px 0 0}

/* ---------- Panels / cards ---------- */
.panel{background:var(--panel);border:1px solid var(--hairline);border-radius:var(--r);padding:20px}
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}

.stat{position:relative;overflow:hidden}
.stat .k{font-family:'IBM Plex Mono';font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel)}
.stat .v{font-family:'Space Grotesk';font-weight:700;font-size:34px;margin-top:8px;line-height:1}
.stat .v small{font-size:16px;color:var(--steel);font-weight:500}
.stat .corner{position:absolute;top:0;right:0;width:42px;height:42px;border-top:1px solid var(--phosphor-dim);border-right:1px solid var(--phosphor-dim);opacity:.4;border-top-right-radius:10px}

.ring{--p:0;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--phosphor) calc(var(--p)*1%), var(--hairline-soft) 0);}
.ring .inner{width:64px;height:64px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:'Space Grotesk';font-weight:700;font-size:18px}

/* ---------- Tier badges ---------- */
.tier-pill{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:5px;border:1px solid;display:inline-block}
.t-beginner{color:var(--phosphor);border-color:var(--phosphor-dim);background:rgba(84,230,196,.06)}
.t-intermediate{color:var(--amber);border-color:var(--amber-dim);background:rgba(242,163,60,.06)}
.t-advanced{color:var(--alert);border-color:var(--alert-dim);background:rgba(255,95,115,.06)}

/* ---------- Course cards ---------- */
.course-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.16s;position:relative}
.course-card:hover{border-color:var(--phosphor-dim);transform:translateY(-2px)}
.course-card .cid{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.1em;color:var(--steel)}
.course-card h3{font-size:16px;font-weight:600}
.course-card .blurb{font-size:13px;color:var(--steel);flex:1}
.course-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.bar{height:5px;background:var(--hairline-soft);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--phosphor-dim),var(--phosphor));border-radius:99px;transition:width .5s}
.status-tag{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.06em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.st-done{color:var(--phosphor);background:rgba(84,230,196,.1)}
.st-prog{color:var(--amber);background:rgba(242,163,60,.1)}
.st-new{color:var(--steel);background:var(--panel-2)}
.st-locked{color:var(--alert);background:rgba(255,95,115,.08)}

.check{color:var(--phosphor)}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:8px;padding:11px 18px;font-weight:600;font-size:13.5px;transition:.15s}
.btn-primary{background:var(--phosphor);color:#06231d}
.btn-primary:hover{box-shadow:0 0 0 3px rgba(84,230,196,.2)}
.btn-amber{background:var(--amber);color:#2a1b06}
.btn-amber:hover{box-shadow:0 0 0 3px rgba(242,163,60,.2)}
.btn-ghost{background:transparent;border:1px solid var(--hairline);color:var(--ink-text)}
.btn-ghost:hover{border-color:var(--phosphor-dim);color:var(--phosphor)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- Module list rows ---------- */
.modrow{display:flex;gap:14px;padding:14px 15px;border:1px solid var(--hairline);border-radius:9px;background:var(--panel-2);margin-bottom:10px;align-items:center;cursor:pointer;transition:.14s}
.modrow:hover{border-color:var(--phosphor-dim)}
.modrow.locked{opacity:.5;cursor:not-allowed}
.modrow.locked:hover{border-color:var(--hairline)}
.modrow .num{flex:0 0 28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:'IBM Plex Mono';font-size:12px;font-weight:600;background:rgba(84,230,196,.08);color:var(--phosphor);border:1px solid var(--phosphor-dim)}
.modrow.done .num{background:var(--phosphor);color:#06231d;border-color:var(--phosphor)}
.modrow.locked .num{background:var(--panel);color:var(--steel-dim);border-color:var(--hairline)}
.modrow .mt{font-weight:600;font-size:14.5px;font-family:'Space Grotesk'}
.modrow .md{font-size:12.5px;color:var(--steel);margin-top:2px}
.modrow .st{margin-left:auto;flex:0 0 auto}

/* ---------- Module reader ---------- */
.reader{max-width:840px}
.reader h2{font-size:21px;margin:26px 0 10px;color:var(--ink-text)}
.reader p{font-size:14.5px;line-height:1.75;color:#c6d2e8;margin:0 0 14px}
.objbox{border:1px solid var(--phosphor-dim);border-radius:10px;background:rgba(84,230,196,.05);padding:16px 18px;margin:14px 0 8px}
.objbox .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--phosphor);text-transform:uppercase}
.objbox ul{margin:8px 0 0;padding-left:20px}
.objbox li{font-size:13.5px;line-height:1.65;color:#c6d2e8;margin-bottom:4px}
.exbox{border-left:3px solid var(--amber);background:rgba(242,163,60,.05);padding:14px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.exbox .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}
.exbox p{margin:8px 0 0;font-size:14px}
.refitem{display:flex;gap:12px;padding:11px 14px;border:1px solid var(--hairline);border-radius:8px;background:var(--panel-2);margin-bottom:8px;font-size:13px}
.refitem .src{font-family:'IBM Plex Mono';font-size:12px;color:var(--phosphor);flex:0 0 auto;max-width:280px}
.refitem .why{color:var(--steel)}

/* ---------- Knowledge check ---------- */
.kc{border:1px solid var(--amber-dim);border-radius:12px;background:var(--panel);padding:22px;margin-top:26px}
.kc .khead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.kc .ktitle{font-family:'Space Grotesk';font-weight:700;font-size:17px}
.kc .kprog{font-family:'IBM Plex Mono';font-size:11px;color:var(--steel)}
.kc .qt{font-weight:600;font-size:15.5px;margin:6px 0 14px;font-family:'Space Grotesk';line-height:1.4}
.fb{border-radius:9px;padding:13px 15px;margin:12px 0;font-size:13.5px;line-height:1.6}
.fb-ok{border:1px solid var(--phosphor-dim);background:rgba(84,230,196,.08);color:var(--phosphor)}
.fb-retry{border:1px solid var(--amber-dim);background:rgba(242,163,60,.08);color:var(--amber)}
.fb-reveal{border:1px solid var(--alert-dim);background:rgba(255,95,115,.07);color:var(--ink-text)}
.fb .xp{color:#c6d2e8;margin-top:6px;display:block}
.kc-done{text-align:center;padding:26px 16px}
.kc-done .big{font-family:'Space Grotesk';font-weight:700;font-size:22px;color:var(--phosphor);margin:10px 0 6px}

/* ---------- Exam ---------- */
.q{border:1px solid var(--hairline);border-radius:10px;padding:18px 20px;margin-bottom:14px;background:var(--panel)}
.q .qn{font-family:'IBM Plex Mono';font-size:11px;color:var(--phosphor);letter-spacing:.08em}
.q .qt{font-weight:600;font-size:15px;margin:8px 0 14px;font-family:'Space Grotesk'}
.opt{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1px solid var(--hairline);border-radius:8px;margin-bottom:9px;cursor:pointer;transition:.12s}
.opt:hover{border-color:var(--steel)}
.opt.sel{border-color:var(--phosphor);background:rgba(84,230,196,.07)}
.opt .rad{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--steel-dim);flex:0 0 16px}
.opt.sel .rad{border-color:var(--phosphor);background:var(--phosphor);box-shadow:inset 0 0 0 3px var(--panel)}
.opt.correct{border-color:var(--phosphor);background:rgba(84,230,196,.12)}
.opt.wrong{border-color:var(--alert);background:rgba(255,95,115,.1)}

/* ---------- Study guide ---------- */
.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--hairline)}
.tab{padding:9px 16px;cursor:pointer;font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--phosphor);border-bottom-color:var(--phosphor)}
.readychk{display:flex;align-items:center;gap:9px;font-size:13px;color:#c6d2e8;padding:7px 0}
.readychk .dot{width:16px;height:16px;border-radius:50%;flex:0 0 16px;display:grid;place-items:center;border:1.5px solid var(--steel-dim)}
.readychk.ok .dot{background:var(--phosphor);border-color:var(--phosphor)}
.readychk.ok .dot svg{width:9px;height:9px;stroke:#06231d}
.readychk .dot svg{width:9px;height:9px;stroke:transparent}
.locknote{display:flex;gap:10px;align-items:flex-start;background:rgba(242,163,60,.06);border:1px solid rgba(242,163,60,.25);border-radius:9px;padding:12px 14px;margin-top:12px;font-size:12.5px;color:#c6d2e8;text-align:left}
.locknote svg{width:16px;height:16px;stroke:var(--amber);flex:0 0 16px;margin-top:1px}
.preq{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.preq .chip{font-family:'IBM Plex Mono';font-size:11px;padding:4px 9px;border-radius:5px;border:1px solid var(--hairline);background:var(--panel-2);cursor:pointer;display:flex;align-items:center;gap:6px}
.preq .chip.done{color:var(--phosphor);border-color:var(--phosphor-dim)}
.preq .chip.todo{color:var(--amber);border-color:rgba(242,163,60,.3)}

.deliverable{border-left:3px solid var(--amber);background:rgba(242,163,60,.05);padding:14px 16px;border-radius:0 8px 8px 0;margin-top:6px}
.deliverable .lab{font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.16em;color:var(--amber);text-transform:uppercase}

/* ---------- Auth ---------- */
.auth-wrap{display:grid;grid-template-columns:1.05fr .95fr;min-height:calc(100vh - 32px)}
.auth-art{position:relative;overflow:hidden;border-right:1px solid var(--hairline);
  background:linear-gradient(160deg,#0b1322,#0a0e18 60%);padding:54px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art .grid-bg{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--hairline-soft) 1px,transparent 1px),linear-gradient(90deg,var(--hairline-soft) 1px,transparent 1px);
  background-size:34px 34px;mask-image:radial-gradient(circle at 30% 40%,#000,transparent 75%)}
.auth-art .big{font-family:'Space Grotesk';font-weight:700;font-size:42px;line-height:1.05;position:relative;letter-spacing:-.02em}
.auth-art .big em{font-style:normal;color:var(--phosphor)}
.auth-form{padding:54px 56px;display:flex;flex-direction:column;justify-content:center;max-width:520px}
.field{margin-bottom:15px}
.field label{display:block;font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--console);border:1px solid var(--hairline);color:var(--ink-text);border-radius:8px;padding:11px 13px;font-family:inherit;font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--phosphor);box-shadow:0 0 0 3px rgba(84,230,196,.12)}
.toggle-link{color:var(--phosphor);cursor:pointer;font-weight:600}
.err{color:var(--alert);font-size:13px;margin-top:4px;font-family:'IBM Plex Mono'}

/* ---------- Certificate ---------- */
.cert-tile{border:1px solid var(--hairline);border-radius:10px;overflow:hidden;background:var(--panel)}
.cert-tile .top{padding:16px 18px;border-bottom:1px solid var(--hairline);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cert-tile .bot{padding:13px 18px;display:flex;gap:9px}
.modal{position:fixed;inset:0;z-index:500;background:rgba(5,8,15,.86);display:grid;place-items:center;padding:24px;overflow:auto}
.modal .box{background:var(--panel);border:1px solid var(--hairline);border-radius:12px;padding:22px;max-width:920px;width:100%}
canvas.cert{width:100%;height:auto;border:1px solid var(--hairline);border-radius:8px;background:#0a0e18}

.empty{text-align:center;padding:48px 20px;color:var(--steel)}
.empty svg{width:42px;height:42px;stroke:var(--steel-dim);margin-bottom:12px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--phosphor-dim);color:var(--phosphor);padding:12px 20px;border-radius:9px;font-family:'IBM Plex Mono';font-size:13px;z-index:800;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:rise .3s}
@keyframes rise{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}

.divider{height:1px;background:var(--hairline);margin:24px 0}
.muted{color:var(--steel)}
.tag-row{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:920px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;display:none}
  .rail.open{display:block}
  .main{padding:22px 18px 60px}
  .cols-3,.cols-2,.cols-4{grid-template-columns:1fr}
  .auth-wrap{grid-template-columns:1fr}
  .auth-art{display:none}
  .auth-form{padding:34px 22px}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--hairline);color:var(--ink-text);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
@media print{body::before{display:none}}
</style>
</head>

<script>
/* ============================================================
   CSO Cyber Range — Training Academy
   CPE ST3 Cybersecurity Office (CSO)
   Self-contained LMS. 30 courses x 15 modules. Each module ends
   in a required knowledge check (two attempts per item, then the
   correct answer is revealed with an explanation). Each course
   ends in a 40-item capstone assessment; 80% to pass.
   Persistence via window.storage with localStorage and in-memory
   fallbacks. (Demo auth — not production security.)
   ============================================================ */

/* ---------------- Storage layer ---------------- */
const Store = {
  mem:{},
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k,false); return r?r.value:null; } }
    catch(e){ if(k in this.mem) return this.mem[k]; return null; }
    try{ const v=localStorage.getItem('csorange_'+k); if(v!==null) return v; }catch(e){}
    return (k in this.mem)?this.mem[k]:null;
  },
  async set(k,v){
    this.mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
    try{ localStorage.setItem('csorange_'+k,v); }catch(e){}
  }
};
const uKey = u => 'lms_user_'+u.toLowerCase().replace(/[^a-z0-9_]/g,'_');
async function loadUser(u){ const r=await Store.get(uKey(u)); return r?JSON.parse(r):null; }
async function saveUser(rec){ await Store.set(uKey(rec.username), JSON.stringify(rec)); }
function hashPw(s){ let h=2166136261; for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);} return ('0000000'+(h>>>0).toString(16)).slice(-8); }
function shortHash(s){ let h=5381; for(let i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);} return ('00000000'+(h>>>0).toString(16).toUpperCase()).slice(-8); }

function ensureProgress(cid){
  App.user.progress = App.user.progress||{};
  const n = mods(cid).length||15;
  let p = App.user.progress[cid];
  if(!p) p = App.user.progress[cid] = {modules:Array(n).fill(false),examPassed:false,examScore:0,completedAt:null};
  /* migrate records saved under the old 4-module structure */
  if(!Array.isArray(p.modules)||p.modules.length!==n){
    p.modules = p.examPassed ? Array(n).fill(true) : Array(n).fill(false);
  }
  return p;
}
function allStudied(p){return p.modules.length>0 && p.modules.every(Boolean);}
function moduleUnlocked(p,i){return i===0 || p.modules[i-1]===true || p.modules[i]===true;}
function courseStatus(id){
  const p=App.user.progress&&App.user.progress[id];
  if(!p) return 'new';
  if(p.examPassed) return 'done';
  if(p.modules.some(Boolean)) return 'prog';
  return 'new';
}
function coursePct(id){
  const p=App.user.progress&&App.user.progress[id];
  if(!p) return 0;
  if(p.examPassed) return 100;
  const n=p.modules.length||1;
  return Math.round(p.modules.filter(Boolean).length/n*100);
}
function tierStats(t){
  const list=byTier(t); let done=0;
  list.forEach(c=>{if(App.user.progress&&App.user.progress[c.id]&&App.user.progress[c.id].examPassed)done++;});
  return {done,total:list.length,pct:Math.round(done/list.length*100)};
}
function tierComplete(t){const s=tierStats(t);return s.done===s.total;}
function capstoneState(t){App.user.capstones=App.user.capstones||{};return App.user.capstones[t]||null;}
function allCerts(){return App.user.certs||[];}
function pushRecent(id){
  App.user.recent=(App.user.recent||[]).filter(x=>x!==id);

}

/* 40 items: 2 drawn from each module's knowledge-check bank (30, guaranteeing
   coverage of all 15 modules) + 10 scenario items from the course capstone bank. */
function buildCourseCapstone(ct){
  const perMod=ct.mods.flatMap(m=>shuffle(m.kc).slice(0,2));
  const scen=shuffle(ct.cap||[]).slice(0,Math.max(0,40-perMod.length));
  let qs=perMod.concat(scen);
  if(qs.length<40){ /* backfill from remaining KC items if a bank ran short */
    const used=new Set(qs.map(q=>q.q));
    const extra=ct.mods.flatMap(m=>m.kc).filter(q=>!used.has(q.q));
    qs=qs.concat(shuffle(extra).slice(0,40-qs.length));
  }
  return shuffle(qs).slice(0,40).map((q,i)=>({q:q.q,o:q.o,a:q.a,x:q.x,idx:i}));
}

/* ---------------- Module reader + knowledge check ---------------- */
window.kcSelect=function(oi){
  if(!App.kc||App.kc.fb==='correct'||App.kc.fb==='revealed')return;
  App.kc.sel=oi;App.kc.fb=null;renderKC();
};
window.kcCheck=function(){
  const k=App.kc;const m=curMod();if(!k||!m)return;
  const q=m.kc[k.qi];
  if(k.sel===null||k.sel===undefined){toast('Select an answer first.');return;}
  if(k.sel===q.a){k.fb='correct';}
  else{
    k.attempts++;
    if(k.attempts>=2){k.fb='revealed';}
    else{k.fb='retry';k.sel=null;}
  }
  renderKC();
};
window.kcNext=async function(){
  const k=App.kc;const m=curMod();if(!k||!m)return;
  k.qi++;k.sel=null;k.attempts=0;k.fb=null;
  if(k.qi>=m.kc.length){
    k.complete=true;
    const p=ensureProgress(App.sel);
    if(!p.modules[App.mod]){p.modules[App.mod]=true;await saveUser(App.user);toast('Module complete — knowledge check passed.');}
  }
  renderKC();
};
function curMod(){const ct=content(App.sel);return ct?ct.mods[App.mod]:null;}

function kcHTML(){
  const k=App.kc;const m=curMod();
  const n=m.kc.length;
  if(k.complete){
    const ct=content(App.sel);
    const isLast=App.mod>=ct.mods.length-1;
    return `<div class="kc"><div class="kc-done">
      <div style="color:var(--phosphor)"><svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" style="width:36px;height:36px"><circle cx="12" cy="12" r="10"/><polyline points="8 12.5 11 15.5 16 9.5"/></svg></div>
      <div class="big">Knowledge check complete</div>
      <p class="muted" style="max-width:440px;margin:0 auto 18px">Module ${App.mod+1} is recorded as complete. ${isLast?'All modules are done — the 40-item capstone assessment is now available from the course page.':'The next module is unlocked.'}</p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        ${isLast?`<button class="btn btn-primary" onclick="openCourse('${App.sel}')">Go to capstone →</button>`:`<button class="btn btn-primary" onclick="openModule('${App.sel}',${App.mod+1})">Next module →</button>`}
        <button class="btn btn-ghost" onclick="openCourse('${App.sel}')">Back to course</button>
      </div></div></div>`;
  }
  const q=m.kc[k.qi];
  let fb='';
  if(k.fb==='correct') fb=`<div class="fb fb-ok"><b>✓ Correct.</b>${q.x?`<span class="xp">${esc(q.x)}</span>`:''}</div>`;
  if(k.fb==='retry') fb=`<div class="fb fb-retry"><b>✗ Not quite.</b> That is not the right answer — take another look at the material above and try once more. <span class="mono">(1 attempt remaining)</span></div>`;
  if(k.fb==='revealed') fb=`<div class="fb fb-reveal"><b style="color:var(--alert)">✗ Second attempt incorrect.</b> The correct answer is: <b style="color:var(--phosphor)">${esc(q.o[q.a])}</b>${q.x?`<span class="xp">${esc(q.x)}</span>`:''}</div>`;
  const locked=k.fb==='correct'||k.fb==='revealed';
  return `<div class="kc">
    <div class="khead"><div class="ktitle">Module Knowledge Check <span class="mono" style="font-size:11px;color:var(--amber)">· REQUIRED</span></div><div class="kprog">QUESTION ${k.qi+1} / ${n}</div></div>
    <p class="muted" style="font-size:12.5px;margin:0 0 14px">Answer each item to continue — answers are never revealed up front. You get two attempts per item; after a second miss the correct answer is shown with an explanation and you may proceed.</p>
    <div class="qt">${esc(q.q)}</div>
    ${q.o.map((o,oi)=>{
      let cls='';
      if(locked){ if(oi===q.a)cls='correct'; }
      else if(k.sel===oi)cls='sel';
      return `<div class="opt ${cls}" onclick="kcSelect(${oi})"><div class="rad"></div><div>${esc(o)}${locked&&oi===q.a?' ✓':''}</div></div>`;
    }).join('')}
    ${fb}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px">
      ${locked
        ? `<button class="btn btn-primary" onclick="kcNext()">${k.qi+1>=n?'Finish knowledge check →':'Next question →'}</button>`
        : `<button class="btn btn-amber" onclick="kcCheck()">Check answer</button>`}
    </div>
  </div>`;
}

/* ---------------- Exam engine (course + tier capstones) ---------------- */
window.pick=function(qi,oi){if(App.exam.submitted)return;App.exam.answers[qi]=oi;renderExamBody();};
window.submitExam=async function(){
  const ex=App.exam;
  if(ex.answers.filter(a=>a!==undefined).length<ex.questions.length){toast('Answer every item before submitting.');return;}
  let correct=0;ex.questions.forEach((q,i)=>{if(ex.answers[i]===q.a)correct++;});
  ex.score=Math.round(correct/ex.questions.length*100);ex.correct=correct;ex.submitted=true;
  if(ex.kind==='course'){
    const p=ensureProgress(ex.ref);p.examScore=ex.score;
    if(ex.score>=80){p.examPassed=true;p.completedAt=Date.now();p.modules=p.modules.map(()=>true);addCert('course',ex.ref);}
    await saveUser(App.user);
  }else{
    App.user.capstones=App.user.capstones||{};const prev=App.user.capstones[ex.ref];
    App.user.capstones[ex.ref]={passed:ex.score>=80,score:ex.score,completedAt:Date.now()};
    if(ex.score>=80&&!(prev&&prev.passed))addCert('capstone',ex.ref);
    await saveUser(App.user);
  }
  window.scrollTo(0,0);render();
};
function renderExam(){
  const ex=App.exam;
  if(ex.submitted) return renderExamResult();
  return `<button class="btn btn-ghost" style="margin-bottom:14px;padding:8px 14px" onclick="${ex.kind==='course'?`openCourse('${ex.ref}')`:`go('capstone')`}">${IC.back} Exit assessment</button>
  <div class="page-head"><div class="eyebrow">${ex.kind==='course'?'Course Capstone Assessment':'Tier Capstone Assessment'}</div>
  <h1 style="font-size:24px">${esc(ex.title)}</h1><p>${ex.questions.length} items · select one answer each · 80% to pass${ex.kind==='course'?' · items span all 15 modules':''}.</p></div>
  <div id="exam-body">${examBody()}</div>`;
}
function examBody(){
  const ex=App.exam;
  return ex.questions.map((q,i)=>`<div class="q"><div class="qn">ITEM ${String(i+1).padStart(2,'0')} / ${ex.questions.length}</div><div class="qt">${esc(q.q)}</div>
    ${q.o.map((o,oi)=>`<div class="opt ${ex.answers[i]===oi?'sel':''}" onclick="pick(${i},${oi})"><div class="rad"></div><div>${esc(o)}</div></div>`).join('')}</div>`).join('')
    +`<div class="panel" style="position:sticky;bottom:16px;display:flex;justify-content:space-between;align-items:center"><span class="mono muted" style="font-size:13px">${ex.answers.filter(a=>a!==undefined).length} / ${ex.questions.length} answered</span><button class="btn btn-primary" onclick="submitExam()">Submit for grading →</button></div>`;
}
function renderExamBody(){const b=$('exam-body');if(b)b.innerHTML=examBody();}
function renderExamResult(){
  const ex=App.exam,pass=ex.score>=80;
  return `<div class="page-head"><div class="eyebrow">${ex.kind==='course'?'Course Capstone':'Tier Capstone'} · Result</div><h1>${esc(ex.title)}</h1></div>
  <div class="panel" style="text-align:center;padding:38px;border-color:${pass?'var(--phosphor-dim)':'var(--alert-dim)'}">
    <div class="ring" style="--p:${ex.score};margin:0 auto 18px;width:120px;height:120px"><div class="inner" style="width:92px;height:92px;font-size:26px;color:${pass?'var(--phosphor)':'var(--alert)'}">${ex.score}%</div></div>

    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      ${pass?`<button class="btn btn-primary" onclick="go('certs')">View credentials</button>`:`<button class="btn btn-amber" onclick="${ex.kind==='course'?`startExam('${ex.ref}')`:`startCapstone('${ex.ref}')`}">Retake</button>`}

}

/* ---------------- Capstone tiers ---------------- */
window.startCapstone=function(tier){
  if(!tierComplete(tier)){
    const s=tierStats(tier);
    toast(`Capstone locked — certify all ${s.total} courses first (${s.total-s.done} remaining).`);
    App.view='capstone';render();return;
  }
  const pool=byTier(tier).flatMap(c=>{
    const ct=content(c.id);if(!ct)return[];
    return (ct.cap||[]).concat(ct.mods.flatMap(m=>m.kc));
  });
  const questions=shuffle(pool).slice(0,40).map((q,i)=>({q:q.q,o:q.o,a:q.a,x:q.x,idx:i}));
  App.exam={kind:'capstone',ref:tier,title:TIERS[tier].label+' — Capstone Assessment',questions,answers:[],submitted:false};
  App.view='exam';window.scrollTo(0,0);render();
};
function renderCapstone(){
  let html=`<div class="page-head"><div class="eyebrow">Tier Credentials · 40-item proficiency assessments</div>
  <h1>Capstone Tiers</h1><p>Each tier capstone is a comprehensive 40-item assessment drawn from every course in that tier. <b>You must certify every course in a tier before its capstone unlocks</b>; pass at 80% to earn the tier credential.</p></div>`;
  Object.values(TIERS).forEach(t=>{
    const s=tierStats(t.key),unlocked=tierComplete(t.key),cs=capstoneState(t.key);
    const remaining=byTier(t.key).filter(c=>!(App.user.progress&&App.user.progress[c.id]&&App.user.progress[c.id].examPassed));
    html+=`<div class="panel" style="margin-bottom:16px;border-color:${cs&&cs.passed?'var(--phosphor-dim)':'var(--hairline)'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px">
          <span class="tier-pill ${t.cls}">${t.label}</span>
          <h3 style="margin:12px 0 6px;font-size:19px">${t.label.split('—')[1].trim()} Capstone</h3>
          <div class="muted mono" style="font-size:12px">${byTier(t.key).length} courses · 40-item assessment · 80% to pass</div>
          <div class="bar" style="margin:14px 0;max-width:360px"><i style="width:${s.pct}%"></i></div>
          <div class="muted" style="font-size:13px">${s.done} of ${s.total} prerequisite courses certified${cs&&cs.passed?` · <span style="color:var(--phosphor)">Capstone passed (${cs.score}%)</span>`:''}</div>
        </div>
        <div style="text-align:center;min-width:200px">
          ${cs&&cs.passed
            ?`<div class="status-tag st-done" style="display:inline-block;margin-bottom:12px">✓ Tier Credential earned</div><br><button class="btn btn-primary" onclick="go('certs')">View credential</button><br><button class="btn btn-ghost" style="margin-top:8px" onclick="startCapstone('${t.key}')">Retake</button>`
            :unlocked
              ?`<div class="status-tag st-prog" style="display:inline-block;margin-bottom:12px">Unlocked</div><br><button class="btn btn-amber" onclick="startCapstone('${t.key}')">Start capstone →</button>`
              :`<div style="color:var(--steel)">${IC.lock}</div><div class="status-tag st-locked" style="display:inline-block;margin-top:8px">Locked · ${s.total-s.done} course${s.total-s.done===1?'':'s'} remaining</div>`}
        </div>
      </div>
      ${(!unlocked && !(cs&&cs.passed)) ? `<div class="divider" style="margin:16px 0 12px"></div>
        <div class="eyebrow" style="margin-bottom:6px">Prerequisites — certify these to unlock</div>
        <div class="preq">${byTier(t.key).map(c=>{const dn=!remaining.includes(c);return `<span class="chip ${dn?'done':'todo'}" onclick="openCourse('${c.id}')">${dn?'✓':'○'} ${c.id}</span>`;}).join('')}</div>` : ''}
    </div>`;
  });
  return html;
}

/* ---------------- Certificates ---------------- */
function addCert(kind,ref){
  App.user.certs=App.user.certs||[];
  const id=kind+'-'+ref+'-'+App.user.username;
  if(App.user.certs.some(c=>c.id===id)) return;
  const title=kind==='course'?course(ref).title:TIERS[ref].label+' Capstone';
  const tier=kind==='course'?course(ref).tier:ref;
  const date=Date.now();
  const hash=shortHash(id+date+App.user.name);
  App.user.certs.push({id,kind,ref,title,tier,date,hash});
}
function renderCerts(){
  const certs=allCerts().slice().sort((a,b)=>b.date-a.date);
  let html=`<div class="page-head"><div class="eyebrow">Credentials Wallet · CPE ST3 CSO</div>
  <h1>My Credentials</h1><p>Verifiable certificates of completion. Course certificates are issued on capstone pass; tier credentials on tier capstone pass. Download as PNG or PDF.</p></div>`;
  if(!certs.length){return html+`<div class="panel"><div class="empty">${IC.cert}<div>No credentials yet. Pass a course capstone to earn your first certificate.</div><button class="btn btn-primary" style="margin-top:14px" onclick="go('catalog')">Browse catalog</button></div></div>`;}
  const caps=certs.filter(c=>c.kind==='capstone'),crs=certs.filter(c=>c.kind==='course');
  if(caps.length){html+=`<div class="eyebrow" style="margin-bottom:10px">Tier Credentials</div><div class="grid cols-3" style="margin-bottom:24px">`+caps.map(certTile).join('')+`</div>`;}
  html+=`<div class="eyebrow" style="margin-bottom:10px">Course Certificates</div><div class="grid cols-3">`+(crs.length?crs.map(certTile).join(''):`<div class="muted">No course certificates yet.</div>`)+`</div>`;
  return html;
}
function certTile(c){
  const t=TIERS[c.tier];
  return `<div class="cert-tile">
    <div class="top"><div><div class="mono" style="font-size:10px;color:var(--steel)">${c.kind==='capstone'?'TIER CREDENTIAL':'COURSE CERTIFICATE'}</div><div style="font-weight:600;font-size:14px;margin-top:5px">${esc(c.kind==='course'?course(c.ref).id+' · '+c.title:c.title)}</div></div><span class="tier-pill ${t.cls}" style="font-size:9px;flex:0 0 auto">Tier ${t.roman}</span></div>
    <div class="bot"><button class="btn btn-primary" style="flex:1;justify-content:center;padding:9px" onclick="viewCert('${c.id}')">View</button><button class="btn btn-ghost" style="padding:9px 13px" onclick="downloadCert('${c.id}','png')" title="Download PNG">${IC.dl}</button></div>
    <div style="padding:0 18px 13px"><span class="mono muted" style="font-size:10px">ISSUED ${fmtDate(c.date).toUpperCase()} · VERIFY ${c.hash}</span></div>
  </div>`;
}
window.viewCert=function(id){
  const c=allCerts().find(x=>x.id===id);if(!c)return;
  const m=document.createElement('div');m.className='modal';m.id='cert-modal';
  m.innerHTML=`<div class="box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div class="eyebrow">Credential Preview · ${c.hash}</div><button class="btn btn-ghost" style="padding:6px 12px" onclick="document.getElementById('cert-modal').remove()">Close ✕</button></div>
    <canvas id="cert-canvas" class="cert" width="1600" height="1130"></canvas>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end"><button class="btn btn-ghost" onclick="downloadCert('${id}','png')">${IC.dl} PNG</button><button class="btn btn-primary" onclick="downloadCert('${id}','pdf')">${IC.dl} PDF</button></div></div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
  drawCert($('cert-canvas'),c);
};
/* jsPDF is loaded lazily on first PDF download so an unreachable CDN can
   never block page rendering. */
function loadJsPDF(){
  return new Promise(res=>{
    if(window.jspdf)return res(true);
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    s.async=true;s.onload=()=>res(true);s.onerror=()=>res(false);
    document.head.appendChild(s);
    setTimeout(()=>res(!!window.jspdf),8000);
  });
}
window.downloadCert=async function(id,fmt){
  const c=allCerts().find(x=>x.id===id);if(!c)return;
  const cv=document.createElement('canvas');cv.width=1600;cv.height=1130;
  await drawCert(cv,c);
  const fname='CSO_'+(c.kind==='course'?course(c.ref).id:'TIER_'+TIERS[c.tier].roman)+'_'+App.user.username;
  const savePng=()=>cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fname+'.png';a.click();});
  if(fmt==='png'){savePng();}
  else{
    const ok=await loadJsPDF();
    try{
      if(!ok||!window.jspdf)throw new Error('jspdf unavailable');
      const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'px',format:[1600,1130]});
      pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,1600,1130);pdf.save(fname+'.pdf');
    }catch(e){toast('PDF engine unavailable — downloading PNG instead.');savePng();}
  }
  toast('Credential downloaded.');
};

/* ---------------- Official CSO seal (SVG, used in chrome) ---------------- */
function sealSVG(sz){
  return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" fill="none">
    <polygon points="50,4 88,26 88,74 50,96 12,74 12,26" stroke="var(--phosphor)" stroke-width="3" fill="rgba(84,230,196,.06)"/>
    <polygon points="50,16 78,32 78,68 50,84 22,68 22,32" stroke="var(--amber)" stroke-width="1.5"/>
    <path d="M38 50 l9 9 l16 -18" stroke="var(--phosphor)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ---------------- Certificate canvas ---------------- */
async function drawCert(cv,c){
  try{await Promise.all([
    document.fonts.load('700 64px "Space Grotesk"'),
    document.fonts.load('500 64px "Space Grotesk"'),
    document.fonts.load('600 26px "IBM Plex Mono"'),
    document.fonts.load('400 24px "Inter"')
  ]);}catch(e){}
  const x=cv.getContext('2d'),W=cv.width,H=cv.height;
  const accent=c.tier==='beginner'?'#54E6C4':c.tier==='intermediate'?'#F2A33C':'#FF5F73';
  const t=TIERS[c.tier];
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0c1322');g.addColorStop(1,'#080c16');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.16;x.strokeStyle=accent;x.lineWidth=1;
  for(const[cx,cy]of[[140,150],[W-140,150],[140,H-150],[W-140,H-150]]){
    for(let r=14;r<150;r+=9){x.beginPath();for(let a=0;a<=Math.PI*2+0.1;a+=0.12){const rr=r+Math.sin(a*7)*5;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr*0.85);}x.stroke();}
  }
  x.restore();
  x.strokeStyle=accent;x.lineWidth=3;x.strokeRect(40,40,W-80,H-80);
  x.strokeStyle='rgba(130,148,182,.45)';x.lineWidth=1;x.strokeRect(54,54,W-108,H-108);
  x.save();x.fillStyle='rgba(130,148,182,.4)';x.font='10px "IBM Plex Mono"';
  const micro=('CPE ST3 CYBERSECURITY OFFICE · AUTHENTIC CREDENTIAL · '+c.hash+' · ').repeat(20);
  x.fillText(micro.slice(0,210),70,78);x.fillText(micro.slice(0,210),70,H-66);x.restore();
  const cx=W/2;
  x.save();x.translate(cx,170);
  const hex=(rad,col,lw)=>{x.beginPath();for(let i=0;i<6;i++){const a=-Math.PI/2+i*Math.PI/3;x[i?'lineTo':'moveTo'](Math.cos(a)*rad,Math.sin(a)*rad);}x.closePath();x.strokeStyle=col;x.lineWidth=lw;x.stroke();};
  hex(56,accent,3);hex(42,'rgba(130,148,182,.6)',1.5);
  x.strokeStyle=accent;x.lineWidth=6;x.lineCap='round';x.lineJoin='round';
  x.beginPath();x.moveTo(-17,2);x.lineTo(-4,16);x.lineTo(22,-14);x.stroke();
  x.restore();
  const ctr=(txt,y,font,col,ls)=>{x.fillStyle=col;x.font=font;x.textAlign='center';if(ls){x.save();letterCenter(x,txt,cx,y,ls);x.restore();}else x.fillText(txt,cx,y);};
  ctr('CPE ST3 CYBERSECURITY OFFICE (CSO)',262,'600 22px "IBM Plex Mono"','#8294B6',5);
  ctr(c.kind==='capstone'?'TIER PROFICIENCY CREDENTIAL':'CERTIFICATE OF COMPLETION',322,'700 40px "Space Grotesk"','#DCE5F5',2);
  x.strokeStyle=accent;x.lineWidth=2;x.beginPath();x.moveTo(cx-120,352);x.lineTo(cx+120,352);x.stroke();
  ctr('This credential is awarded to',420,'400 24px "Inter"','#8294B6');
  ctr(App.user.name,500,'500 62px "Space Grotesk"','#FFFFFF');
  x.strokeStyle='rgba(130,148,182,.35)';x.lineWidth=1;x.beginPath();x.moveTo(cx-380,530);x.lineTo(cx+380,530);x.stroke();
  ctr(c.kind==='capstone'?'for demonstrating comprehensive proficiency across the':'for completing all fifteen modules and passing the 40-item capstone assessment for',590,'400 24px "Inter"','#8294B6');
  const title=c.kind==='course'?course(c.ref).id+'  ·  '+c.title:t.label;
  x.fillStyle=accent;x.font='600 38px "Space Grotesk"';x.textAlign='center';
  wrapText(x,title,cx,660,1180,46);
  if(c.kind==='capstone')ctr('40-item Capstone Assessment · CSO Cyber Range',724,'400 22px "Inter"','#8294B6');
  const fy=H-150;
  x.textAlign='center';
  const col=(label,val,px)=>{x.fillStyle='#8294B6';x.font='500 16px "IBM Plex Mono"';x.fillText(label,px,fy);x.strokeStyle='rgba(130,148,182,.4)';x.beginPath();x.moveTo(px-150,fy+12);x.lineTo(px+150,fy+12);x.stroke();x.fillStyle='#DCE5F5';x.font='400 22px "Inter"';x.fillText(val,px,fy+44);};
  col('DATE OF ISSUE',fmtDate(c.date),cx-440);
  x.fillStyle='#DCE5F5';x.font='italic 30px "Space Grotesk"';x.fillText('R. Calderon',cx,fy);
  x.strokeStyle='rgba(130,148,182,.4)';x.beginPath();x.moveTo(cx-150,fy+12);x.lineTo(cx+150,fy+12);x.stroke();
  x.fillStyle='#8294B6';x.font='500 15px "IBM Plex Mono"';x.fillText('AUTHORIZING OFFICIAL · CSO',cx,fy+38);
  col('VERIFICATION ID',c.hash,cx+440);
}
function letterCenter(x,txt,cx,y,ls){
  const w=txt.split('').reduce((s,ch)=>s+x.measureText(ch).width+ls,-ls);
  let px=cx-w/2;x.textAlign='left';
  for(const ch of txt){x.fillText(ch,px,y);px+=x.measureText(ch).width+ls;}
  x.textAlign='center';
}
function wrapText(x,text,cx,y,maxW,lh){
  const words=text.split(' ');let line='',lines=[];
  for(const w of words){const test=line?line+' '+w:w;if(x.measureText(test).width>maxW&&line){lines.push(line);line=w;}else line=test;}
  lines.push(line);
  const startY=y-(lines.length-1)*lh/2;
  lines.forEach((l,i)=>x.fillText(l,cx,startY+i*lh));
}

/* ---------------- Render dispatcher ---------------- */
function render(){
  if(!App.user){renderAuth();return;}
  let body;
  switch(App.view){
    case 'catalog':body=renderCatalog();break;
    case 'course':body=renderCourse();break;
    case 'module':body=renderModule();break;
    case 'exam':body=renderExam();break;
    case 'capstone':body=renderCapstone();break;
    case 'certs':body=renderCerts();break;
    default:body=renderDashboard();
  }
  root.innerHTML=shell(body);
  startClock();
}

(async function init(){
  try{const s=await Store.get('lms_session');if(s){const u=await loadUser(s);if(u)App.user=u;}}catch(e){}

})();
