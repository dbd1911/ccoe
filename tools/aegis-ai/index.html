@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; }
.ag-app, .ag-landing { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

/* ---- Landing ---- */
.ag-landing { position: fixed; inset: 0; background: ${k.bg}; color: ${k.text};
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  transition: opacity .45s ease, transform .45s ease; }
.ag-landing.ag-leaving { opacity: 0; transform: scale(1.02); }
.ag-grid-bg { position: absolute; inset: 0; opacity: .4;
  background-image: linear-gradient(${k.line} 1px, transparent 1px), linear-gradient(90deg, ${k.line} 1px, transparent 1px);
  background-size: 46px 46px; mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%); }
.ag-glow { position: absolute; width: 700px; height: 700px; top: -180px; left: 50%; transform: translateX(-50%);
  background: radial-gradient(circle, rgba(16,185,129,0.16), transparent 60%); filter: blur(20px); }
.ag-landing-inner { position: relative; max-width: 860px; padding: 32px; text-align: center; animation: rise .8s cubic-bezier(.2,.8,.2,1); }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.ag-logo-row { display: inline-flex; gap: 12px; align-items: center; margin-bottom: 30px; }
.ag-logo-mark { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(145deg, ${k.navyHi}, ${k.emeraldDim}); box-shadow: 0 0 28px rgba(16,185,129,.4); }
.ag-logo-mark.sm { width: 36px; height: 36px; border-radius: 10px; box-shadow: 0 0 16px rgba(16,185,129,.3); }
.ag-brand { font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
.ag-brand.sm { font-size: 17px; }
.ag-brand-sub { font-size: 9px; letter-spacing: 3px; color: ${k.mut2}; margin-top: 3px; }
.ag-brand-sub.sm { font-size: 8px; letter-spacing: 2px; }
.ag-hero-title { font-size: clamp(30px, 5vw, 52px); font-weight: 800; letter-spacing: -1.5px; line-height: 1.05; margin: 0 0 18px; }
.ag-hero-sub { font-size: 16px; line-height: 1.6; color: ${k.mut}; max-width: 620px; margin: 0 auto 40px; }
.ag-preview-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 44px; }
.ag-preview { padding: 22px 18px; border-radius: 16px; text-align: left;
  background: linear-gradient(160deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
  border: 1px solid ${k.line}; backdrop-filter: blur(8px); transition: transform .25s, border-color .25s; }
.ag-preview:hover { transform: translateY(-4px); border-color: rgba(16,185,129,.4); }
.ag-preview-ico { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center;
  color: ${k.emerald}; background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.25); margin-bottom: 14px; }
.ag-preview-t { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
.ag-preview-d { font-size: 12.5px; color: ${k.mut}; line-height: 1.5; }
.ag-enter { display: inline-flex; align-items: center; gap: 10px; padding: 15px 40px; border: none; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #04150f; border-radius: 13px;
  background: linear-gradient(135deg, #34e0a8, ${k.emerald}); box-shadow: 0 0 0 1px rgba(16,185,129,.4), 0 12px 36px rgba(16,185,129,.34);
  transition: transform .2s, box-shadow .2s; }
.ag-enter:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 0 1px rgba(16,185,129,.6), 0 16px 48px rgba(16,185,129,.5); }
.ag-landing-foot { margin-top: 34px; font-size: 9.5px; letter-spacing: 2px; color: ${k.mut2}; }

/* ---- App shell ---- */
.ag-app { display: flex; min-height: 100vh; background: ${k.bg};
  background-image: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(38,64,110,0.25), transparent 60%); color: ${k.text}; }
.ag-side { width: 258px; flex-shrink: 0; padding: 22px 16px; border-right: 1px solid ${k.line};
  display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; background: rgba(10,15,30,0.6); backdrop-filter: blur(10px); }
.ag-side-brand { display: flex; gap: 11px; align-items: center; padding: 4px 6px; }
.ag-nav { display: flex; flex-direction: column; gap: 3px; }
.ag-nav-btn { position: relative; display: flex; align-items: center; gap: 11px; padding: 11px 13px; border: none; cursor: pointer;
  background: transparent; color: ${k.mut}; font-family: inherit; font-size: 13.5px; font-weight: 500; border-radius: 10px; text-align: left;
  transition: background .18s, color .18s; }
.ag-nav-btn:hover { background: rgba(255,255,255,0.04); color: ${k.text}; }
.ag-nav-btn.on { background: rgba(16,185,129,0.1); color: ${k.text}; }
.ag-nav-dot { position: absolute; right: 12px; width: 6px; height: 6px; border-radius: 50%; background: ${k.emerald}; box-shadow: 0 0 8px ${k.emerald}; }
.ag-side-ctx { margin-top: auto; padding: 14px; border-radius: 13px; background: rgba(255,255,255,0.03); border: 1px solid ${k.line}; }
.ag-ctx-l { font-size: 9px; letter-spacing: 2px; color: ${k.mut2}; text-transform: uppercase; margin-bottom: 8px; }
.ag-ctx-sel { width: 100%; font-size: 12.5px; }
.ag-ctx-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.ag-side-foot { font-size: 8.5px; letter-spacing: 1.5px; color: ${k.mut2}; text-align: center; }
.ag-main { flex: 1; padding: 34px 40px; min-width: 0; animation: fade .4s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.ag-page { display: flex; flex-direction: column; gap: 18px; max-width: 1180px; }

/* ---- Type ---- */
.ag-eyebrow { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: ${k.emerald}; font-weight: 600; }
.ag-page-title { font-size: 28px; font-weight: 800; letter-spacing: -.8px; margin: 6px 0 0; }
.ag-page-sub { font-size: 13.5px; color: ${k.mut}; margin: 6px 0 0; }
.ag-card-h { font-size: 12.5px; color: ${k.mut2}; margin: 3px 0 8px; }

/* ---- Card ---- */
.ag-card { background: linear-gradient(165deg, ${k.panel}, ${k.bg2}); border: 1px solid ${k.line}; border-radius: 16px; padding: 18px; }

/* ---- KPI ---- */
.ag-kpi-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.ag-kpi { display: flex; align-items: center; gap: 14px; }
.ag-kpi-ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; border: 1px solid; flex-shrink: 0; }
.ag-kpi-num { font-size: 26px; font-weight: 700; letter-spacing: -.5px; line-height: 1; }
.ag-kpi-label { font-size: 11px; color: ${k.mut}; margin-top: 5px; }

.ag-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* ---- Pills / dots ---- */
.ag-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; border: 1px solid; }
.ag-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.ag-legend-row { display: flex; align-items: center; gap: 9px; padding: 5px 0; }

/* ---- PM bars ---- */
.ag-pm-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid ${k.lineSoft}; }
.ag-bar-track { flex: 1; height: 7px; border-radius: 99px; background: rgba(255,255,255,0.05); overflow: hidden; }
.ag-bar-fill { height: 100%; border-radius: 99px; transition: width .5s cubic-bezier(.2,.8,.2,1); }
.ag-pm-badge { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 7px; border: 1px solid; min-width: 46px; text-align: center; }
.ag-exp-row { display: flex; align-items: center; gap: 11px; padding: 9px 0; border-bottom: 1px solid ${k.lineSoft}; }
.ag-days { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 7px; border: 1px solid; }
.ag-empty { color: ${k.mut2}; font-size: 13px; text-align: center; }

/* ---- Buttons ---- */
.ag-btn { display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  padding: 9px 15px; border-radius: 10px; border: 1px solid ${k.line}; background: rgba(255,255,255,0.03); color: ${k.text}; transition: all .18s; }
.ag-btn:hover { background: rgba(255,255,255,0.07); transform: translateY(-1px); }
.ag-btn-solid { background: linear-gradient(135deg, #34e0a8, ${k.emerald}); color: #04150f; border-color: transparent; }
.ag-btn-solid:hover { box-shadow: 0 8px 24px rgba(16,185,129,.35); }
.ag-btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.ag-icon-btn { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; cursor: pointer;
  background: rgba(255,255,255,0.04); border: 1px solid ${k.line}; color: ${k.mut}; transition: all .15s; }
.ag-icon-btn:hover { background: rgba(255,255,255,0.1); color: ${k.text}; }

/* ---- Filters / table ---- */
.ag-filters { display: flex; gap: 10px; flex-wrap: wrap; }
.ag-search { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid ${k.line}; }
.ag-search input { flex: 1; background: transparent; border: none; outline: none; color: ${k.text}; font-family: inherit; font-size: 13px; padding: 10px 0; }
.ag-select, .ag-input { background: rgba(255,255,255,0.03); border: 1px solid ${k.line}; color: ${k.text}; font-family: inherit;
  font-size: 13px; padding: 9px 11px; border-radius: 10px; outline: none; transition: border-color .15s; }
.ag-select:focus, .ag-input:focus { border-color: rgba(16,185,129,.5); }
.ag-select option, .ag-input option { background: ${k.panel}; color: ${k.text}; }
.ag-table-wrap { overflow-x: auto; }
.ag-table { width: 100%; border-collapse: collapse; }
.ag-table th { text-align: left; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: ${k.mut2}; font-weight: 600;
  padding: 12px 14px; border-bottom: 1px solid ${k.line}; white-space: nowrap; }
.ag-table td { padding: 12px 14px; border-bottom: 1px solid ${k.lineSoft}; font-size: 13px; vertical-align: middle; }
.ag-table tbody tr { transition: background .15s; }
.ag-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.ag-actions { display: flex; gap: 6px; }
.ag-sel { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }

/* ---- Modal ---- */
.ag-overlay { position: fixed; inset: 0; background: rgba(4,8,18,0.72); backdrop-filter: blur(5px); display: grid; place-items: center;
  z-index: 50; padding: 20px; animation: fade .2s ease; }
.ag-modal { width: 520px; max-width: 100%; max-height: 88vh; overflow: auto; background: ${k.panel}; border: 1px solid ${k.line};
  border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.6); animation: rise .3s cubic-bezier(.2,.8,.2,1); }
.ag-modal.wide { width: 720px; }
.ag-modal-head { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-bottom: 1px solid ${k.line}; position: sticky; top: 0; background: ${k.panel}; }
.ag-modal-title { font-size: 16px; font-weight: 700; }
.ag-modal-body { padding: 20px; }
.ag-modal-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
.ag-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
.ag-field { display: flex; flex-direction: column; gap: 6px; }
.ag-field-l { font-size: 11px; color: ${k.mut}; font-weight: 500; }
.ag-field .ag-input { width: 100%; }
.ag-err { color: #ef4444; font-style: normal; font-size: 10px; }

/* ---- Posture ---- */
.ag-posture-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 16px; align-items: start; }
.ag-ctrl { display: flex; align-items: center; gap: 11px; width: 100%; padding: 11px 12px; margin-bottom: 6px; cursor: pointer;
  background: rgba(255,255,255,0.02); border: 1px solid ${k.lineSoft}; border-radius: 11px; transition: all .15s; }
.ag-ctrl:hover { background: rgba(255,255,255,0.05); border-color: ${k.line}; }
.ag-crit { font-size: 8px; letter-spacing: 1px; color: #ef4444; border: 1px solid #ef444455; background: #ef44441a; padding: 1px 5px; border-radius: 5px; margin-left: 8px; vertical-align: middle; }
.ag-ctrl-state { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 7px; border: 1px solid; white-space: nowrap; }
.ag-baseline { font-size: 12px; color: ${k.mut}; margin-top: 4px; }
.ag-slider-block { margin-top: 14px; }
.ag-slider-top { display: flex; justify-content: space-between; font-size: 12.5px; color: ${k.mut}; margin-bottom: 8px; }
.ag-range { width: 100%; accent-color: ${k.emerald}; height: 5px; cursor: pointer; }
.ag-range-lg { height: 8px; margin: 16px 0 6px; }
.ag-slider-scale { display: flex; justify-content: space-between; font-size: 10px; color: ${k.mut2}; margin-top: 5px; }
.ag-reset { margin-top: 14px; background: none; border: none; color: ${k.mut2}; font-family: inherit; font-size: 11.5px; cursor: pointer; text-decoration: underline; }
.ag-reset:hover { color: ${k.emerald}; }
.ag-auth-row { display: flex; gap: 10px; align-items: center; margin: 10px 0 6px; }
.ag-thresh { font-size: 11px; color: ${k.mut}; white-space: nowrap; }
.ag-auth-desc { font-size: 11.5px; color: ${k.mut2}; margin-bottom: 12px; }
.ag-rec { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid; }

/* ---- Optimization ---- */
.ag-opt-summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 8px; }
.ag-opt-summary > div { display: flex; flex-direction: column; gap: 4px; padding: 11px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid ${k.lineSoft}; }
.ag-opt-k { font-size: 10px; color: ${k.mut2}; text-transform: uppercase; letter-spacing: .5px; }
.ag-opt-summary .mono { font-size: 16px; font-weight: 700; }
.ag-rosi-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: none; cursor: pointer; padding: 0; }
.ag-rosi { margin-top: 14px; font-size: 13px; color: ${k.mut}; line-height: 1.6; }
.ag-rosi p { margin: 0 0 12px; }
.ag-rosi-line { display: flex; justify-content: space-between; gap: 14px; padding: 9px 12px; margin-bottom: 7px; border-radius: 9px;
  background: rgba(255,255,255,0.02); border: 1px solid ${k.lineSoft}; flex-wrap: wrap; }
.ag-rosi-line code { font-size: 12px; color: ${k.text}; }
.ag-rosi-line span { font-size: 12px; }

/* ---- SSAV ---- */
.ag-stepper { display: flex; gap: 8px; flex-wrap: wrap; }
.ag-step { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; border: 1px solid ${k.lineSoft};
  background: rgba(255,255,255,0.02); color: ${k.mut2}; font-size: 12.5px; transition: all .2s; }
.ag-step.on { border-color: ${k.emerald}; color: ${k.text}; background: rgba(16,185,129,.08); }
.ag-step.done { color: ${k.emerald}; }
.ag-step-n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700;
  background: rgba(255,255,255,0.06); }
.ag-step.on .ag-step-n { background: ${k.emerald}; color: #04150f; }
.ag-ssav-q { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 1px solid ${k.lineSoft}; flex-wrap: wrap; }
.ag-ssav-opt { font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 8px 16px; border-radius: 9px; cursor: pointer;
  background: rgba(255,255,255,0.03); border: 1px solid ${k.line}; color: ${k.mut}; transition: all .15s; }
.ag-ssav-opt:hover { color: ${k.text}; }
.ag-ssav-cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 8px; }
.ag-ssav-cat { padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.02); border: 1px solid ${k.lineSoft}; }
.ag-wiz-nav { display: flex; justify-content: space-between; }

/* ---- AI memo / status ---- */
.ag-ai-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 9px; letter-spacing: .5px; text-transform: uppercase;
  color: ${k.emerald}; border: 1px solid ${k.emerald}44; background: ${k.emerald}12; padding: 2px 7px; border-radius: 999px; }
.ag-ai-loading { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: ${k.mut}; padding: 10px 0; }
.ag-spin { animation: spin 1s linear infinite; color: ${k.emerald}; }
@keyframes spin { to { transform: rotate(360deg); } }
.ag-ai-memo { white-space: pre-wrap; font-size: 12.5px; line-height: 1.65; color: ${k.text}; margin-top: 6px;
  padding: 13px; border-radius: 11px; background: rgba(255,255,255,0.02); border: 1px solid ${k.lineSoft}; max-height: 320px; overflow: auto; }
.ag-ai-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }
.ag-ai-foot .mono { font-size: 10px; color: ${k.mut2}; }
.ag-ai-err { display: flex; gap: 10px; align-items: flex-start; padding: 11px; border-radius: 11px; color: #f5b94a;
  border: 1px solid #f5b94a44; background: #f5b94a10; font-size: 13px; }
.ag-ai-status { display: flex; align-items: center; gap: 7px; font-size: 11px; color: ${k.mut}; padding: 0 6px; }

@media (max-width: 920px) {
  .ag-app { flex-direction: column; }
  .ag-side { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 14px; }
  .ag-nav { flex-direction: row; flex-wrap: wrap; flex: 1; }

  .ag-main { padding: 24px 18px; }
  .ag-kpi-strip, .ag-grid-2, .ag-posture-grid, .ag-opt-summary, .ag-ssav-cats, .ag-preview-row, .ag-form-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
