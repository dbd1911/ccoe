<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Data Analysis with Gemini 3.7 Flash</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2em; }
    #result { margin-top: 2em; padding: 1em; border: 1px solid #ccc; background: #f9f9f9; }
    label, input, button { display: block; margin-bottom: 1em; }
  </style>
</head>
<body>
  <h1>Upload Data for LLM Analysis (Gemini 3.7 Flash)</h1>
  <input type="file" id="fileInput" />
  <button onclick="handleFileUpload()">Analyze with LLM</button>
  <div id="result"></div>

  <script>
    // Your Gemini API key (keep this secure in production!)
    const GEMINI_API_KEY = 'STARK_DSS2Z8bN5FU76XLo30BzB1CGhgxcbQIeKOiu2knRQTM';
    const GEMINI_API_URL = 'https://api.genai.mil/v1/chat/completions';
    const GEMINI_MODEL = 'gemini-3.7-flash';

    function handleFileUpload() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      if (!file) {
        alert('Please select a file to upload.');
        return;
      }
      const reader = new FileReader();
      reader.onload = async function(e) {
        const fileContent = e.target.result;
        document.getElementById('result').innerHTML = 'Analyzing...';
        const analysis = await analyzeWithLLM(fileContent);
        document.getElementById('result').innerHTML = '<b>Analysis Result:</b><br>' + analysis;
      };
      reader.readAsText(file);
    }

    async function analyzeWithLLM(data) {
      // You can customize the prompt as needed
      const prompt = `Analyze the following data and provide insights, trends, or anomalies.\n\nData:\n${data}`;
      const body = {
        model: GEMINI_MODEL,
        messages: [
          { role: 'user', content: prompt }
        ]
      };
      try {
        const response = await fetch(GEMINI_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + GEMINI_API_KEY
          },
          body: JSON.stringify(body)
        });
        if (!response.ok) {
          throw new Error('LLM API error: ' + response.statusText);
        }
        const result = await response.json();
        // The response format is assumed to be OpenAI-compatible
        // e.g., result.choices[0].message.content
        return result.choices?.[0]?.message?.content || 'No analysis returned.';
      } catch (error) {
        return 'Error: ' + error.message;
      }
    }
  </script>
</body>
</html>
